[package]
name = "cognee-java-jni"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "JNI (jni-rs) native binding for the cognee Rust SDK (Java)."
repository = "https://github.com/topoteretes/cognee-rs"
homepage = "https://www.cognee.ai"
publish = false

# Standalone crate — not part of the parent workspace (mirrors cognee-ts-neon).
[workspace]

[lib]
name = "cognee_java"
crate-type = ["cdylib"]

[features]
default = [
    "visualization",
    "ladybug",
    "onnx",
    "hf-tokenizer",
    "tiktoken",
    "sqlite",
    "testing",
    "html-loader",
    "telemetry",
]
telemetry     = ["cognee/telemetry"]
visualization = ["cognee/visualization", "cognee-bindings-common/visualization"]
ladybug       = ["cognee/ladybug",       "cognee-bindings-common/ladybug"]
onnx          = ["cognee/onnx",          "cognee-bindings-common/onnx"]
hf-tokenizer  = ["cognee/hf-tokenizer",  "cognee-bindings-common/hf-tokenizer"]
tiktoken      = ["cognee/tiktoken",      "cognee-bindings-common/tiktoken"]
sqlite        = ["cognee/sqlite",        "cognee-bindings-common/sqlite"]
testing       = ["cognee/testing",       "cognee-bindings-common/testing"]
html-loader   = ["cognee/html-loader"]

[dependencies]
cognee-bindings-common = { path = "../../crates/bindings-common", default-features = false }
cognee = { path = "../../crates/lib", default-features = false }
cognee-logging = { path = "../../crates/logging" }
cognee-observability = { path = "../../crates/observability", features = ["telemetry"] }
cognee-telemetry     = { path = "../../crates/telemetry",     features = ["telemetry"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde_json = "1"

# Debug-profile disk tuning — mirrors ts/cognee-ts-neon/Cargo.toml, which
# carries the full measurement table and the explanation of why opt-level and
# debug only pay off together (cargo's OPT_LEVEL/DEBUG env vars drive the
# CMAKE_BUILD_TYPE the `cmake` crate picks for lbug's bundled Ladybug tree).
# Both binding workspaces build the same engine, so both were producing a
# ~12 GiB debug target/ on plain cargo defaults.
#
# Override for one build with: CARGO_PROFILE_DEV_DEBUG=2 cargo build
[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1
