[package]
name = "cognee-java-jni"
version = "0.2.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
description = "JNI (jni-rs) native binding for the cognee Rust SDK (Java)."
repository = "https://github.com/topoteretes/cognee-rs"
homepage = "https://www.cognee.ai"
publish = false
# Member of the bindings/ workspace, which it shares with cognee-ts-neon so the
# ~700-crate engine graph is compiled once for both. Stated explicitly because
# walking up from here finds the root workspace first, and the root does not
# (and should not) list this crate. See bindings/Cargo.toml.
workspace = "../../bindings"

[lib]
name = "cognee_java"
# `rlib` in addition to `cdylib` so a closed cloud binding can link this crate
# and re-export its JNI entry points instead of forking ~2k lines of glue. The
# cdylib output is unchanged for OSS consumers.
crate-type = ["cdylib", "rlib"]

[features]
default = [
    "visualization",
    "ladybug",
    "lancedb",
    "onnx",
    "bedrock",
    "hf-tokenizer",
    "tiktoken",
    "sqlite",
    "testing",
    "html-loader",
    "telemetry",
]
telemetry     = ["cognee/telemetry"]
visualization = ["cognee/visualization", "cognee-bindings-common/visualization"]
ladybug       = ["cognee/ladybug",       "cognee-bindings-common/ladybug"]
lancedb       = ["cognee/lancedb",       "cognee-bindings-common/lancedb"]
onnx          = ["cognee/onnx",          "cognee-bindings-common/onnx"]
bedrock       = ["cognee/bedrock",       "cognee-bindings-common/bedrock"]
hf-tokenizer  = ["cognee/hf-tokenizer",  "cognee-bindings-common/hf-tokenizer"]
tiktoken      = ["cognee/tiktoken",      "cognee-bindings-common/tiktoken"]
sqlite        = ["cognee/sqlite",        "cognee-bindings-common/sqlite"]
testing       = ["cognee/testing",       "cognee-bindings-common/testing"]
html-loader   = ["cognee/html-loader"]
# Document loaders, forwarded like html-loader (they have no
# cognee-bindings-common half). pdf-pure-rust needs no native library, which is
# why `android-default` in cognee/lib picks it; pdf-pdfium below is usable on
# mobile too, but only by shipping a libpdfium and pointing PDFIUM_LIB_PATH at
# it. Prefer pdf-pdfium where that is possible — the pure-Rust extractor
# silently returns empty text for some real PDFs.
pdf-pure-rust = ["cognee/pdf-pure-rust"]
# PDFium extraction, preferred over pdf-pure-rust when both are on (see
# cognee-ingestion's loaders/pdf/mod.rs). It reads PDFs the pure-Rust extractor
# silently returns empty text for — e.g. editions with Type3/undecodable font
# encodings — at the cost of a libpdfium library the consumer must supply
# (pdfium-auto's PDFIUM_LIB_PATH, or its own download on desktop targets; it has
# no Android entry, so an Android consumer must ship the .so and set that var).
pdf-pdfium = ["cognee/pdf-pdfium"]
unstructured-eml = ["cognee/unstructured-eml"]

[dependencies]
cognee-bindings-common = { path = "../../crates/bindings-common", default-features = false }
cognee = { path = "../../crates/lib", default-features = false }
cognee-logging = { path = "../../crates/logging" }
cognee-observability = { path = "../../crates/observability", features = ["telemetry"] }
cognee-telemetry     = { path = "../../crates/telemetry",     features = ["telemetry"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde_json = "1"

# The debug-profile disk tuning that used to live here (a character-identical
# copy of cognee-ts-neon's) moved to bindings/Cargo.toml when both crates became
# members of that workspace: cargo ignores [profile] in a non-root manifest.
