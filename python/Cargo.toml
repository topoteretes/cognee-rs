[package]
name = "cognee-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
# Distributed as a maturin-built PyPI wheel, not a registry crate.
publish = false

[lints]
workspace = true

[lib]
name = "cognee_py"
crate-type = ["cdylib"]
# This crate is a PyO3 extension module (`pyo3/extension-module`): it is built
# as a cdylib whose Python symbols are resolved at runtime by the interpreter,
# so libpython is intentionally not linked. Any *harness* target is a standalone
# executable, which has no interpreter to resolve them and cannot link — build.rs
# cannot help, because `rustc-cdylib-link-arg` applies only to the cdylib.
#
# So all three harness kinds are disabled. `bench` matters as much as the other
# two and is easy to miss: it defaults to true, so leaving it out made
# `cargo build --workspace --all-targets` and `cargo bench --workspace` fail to
# link — cargo reports that unit as "cognee-python (lib test)", which reads like
# a test harness and sent an earlier investigation down the wrong path.
#
# The crate's behaviour is covered by pytest via `python/scripts/check.sh` (the
# `python-check` CI job). Sibling native crates (ts, java, capi) sidestep all of
# this by not being members of this workspace; this one is a member so that
# `cargo check --all-targets` covers it, hence the explicit opt-outs.
test = false
doctest = false
bench = false

[features]
# Mirror cognee-ts-neon's default feature set (ts/cognee-ts-neon/Cargo.toml).
default = [
    "visualization",
    # The closed Python cdylib (T15e — `cognee-py-cloud`) re-adds cloud via
    # `cognee-bindings-cloud`; this OSS cdylib intentionally omits it.
    "ladybug",
    "lancedb",
    "onnx",
    "hf-tokenizer",
    "tiktoken",
    "sqlite",
    "testing",
    # Product-analytics emission ON by default — Python-SDK parity. The
    # cognee `send_telemetry` call sites are otherwise compiled out
    # because cognee is pulled with `default-features = false`.
    "telemetry",
]
# Compiles in the cognee/search/session/core `send_telemetry` call
# sites. Runtime emission is still gated by `is_disabled()`
# (TELEMETRY_DISABLED / ENV / COGNEE_HOST_SDK) — see telemetry_analytics.rs.
telemetry     = ["cognee/telemetry"]
visualization = ["cognee/visualization", "cognee-bindings-common/visualization"]
ladybug       = ["cognee/ladybug",       "cognee-bindings-common/ladybug"]
lancedb       = ["cognee/lancedb",       "cognee-bindings-common/lancedb"]
onnx          = ["cognee/onnx",          "cognee-bindings-common/onnx"]
hf-tokenizer  = ["cognee/hf-tokenizer",  "cognee-bindings-common/hf-tokenizer"]
tiktoken      = ["cognee/tiktoken",      "cognee-bindings-common/tiktoken"]
sqlite        = ["cognee/sqlite",        "cognee-bindings-common/sqlite"]
testing       = ["cognee/testing",       "cognee-bindings-common/testing"]

[build-dependencies]
# For build.rs — emits the `-undefined dynamic_lookup` cdylib link args a PyO3
# extension module needs on macOS.
#
# Track `pyo3`'s *minor* version below, not its major: these are 0.x crates, so
# 0.23 -> 0.24 is the breaking step. In practice pyo3 already pins it for us —
# pyo3 0.23.5 declares `pyo3-build-config = "=0.23.5"` as its own
# build-dependency, so cargo unifies both to one version and Cargo.lock holds a
# single entry. Bumping `pyo3` here without bumping this line would resolve two
# different pyo3-build-config copies, and this script would emit link args from
# a version that no longer matches the pyo3 the crate compiles against.
pyo3-build-config = "0.23"

[dependencies]
# Shared SDK facade (HandleState, CogneeServices, SdkError).
cognee-bindings-common = { path = "../crates/bindings-common", default-features = false }
# Full cognee SDK — same feature set as cognee-ts-neon.
cognee = { path = "../crates/lib", default-features = false }
serde_json = { workspace = true }
# bytes/bytearray → base64 in py_to_serde (wire::marshal_bytes expects base64).
base64 = { workspace = true }

cognee-core = { path = "../crates/core" }
cognee-database = { path = "../crates/database", features = ["sqlite"] }
cognee-graph = { path = "../crates/graph", features = ["testing"] }
cognee-vector = { path = "../crates/vector", features = ["testing"] }
cognee-logging = { path = "../crates/logging" }
# Bridge Rust `tracing` events into Python `logging` (gap 07 decision 5).
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log        = "0.2"
pyo3-log           = "0.12"
log                = "0.4"

# Optional opentelemetry / send_telemetry surfaces. Both have noop
# bodies when the `telemetry` feature is off, so the binding can
# still build under `--no-default-features` once feature wiring is
# in place (out of scope for v1 — feature is on by default here per
# gap 07 decision 3).
cognee-observability = { path = "../crates/observability", features = ["telemetry"] }
cognee-telemetry     = { path = "../crates/telemetry",     features = ["telemetry"] }
pyo3 = { version = "0.23", features = ["extension-module", "multiple-pymethods"] }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }
tokio = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
