name: Community Checks (No Secrets)

# Runs on ALL pull requests, including those from forks.
#
# Fork pull requests never receive repository secrets (GitHub withholds them
# from `pull_request` runs on forks, even after maintainer approval), so the
# keyed `Test Suite` workflow is gated to in-repo branches and skips on forks.
# This workflow fills that gap: no secrets are required — the LLM/integration
# tests detect the absent OPENAI_* / LLM_* env vars and skip themselves — so
# community contributors still get fast lint + secret-free test feedback.
#
# Mirrors the upstream Python cognee `community_tests.yml` split.

on:
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened ]

# Minimal token: this lane handles untrusted fork code and must never need
# write access or secrets.
permissions:
  contents: read

concurrency:
  group: community-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Mirror the keyed CI env so the shared rust-cache fingerprints line up and
  # fork runs can restore the warm caches the main-branch CI populated.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  ORT_CACHE_DIR: ${{ github.workspace }}/target/ort-cache
  CCACHE_COMPILERCHECK: content

jobs:
  # ── Lint: fmt + check + clippy (no secrets) ───────────────────────────
  lint:
    name: Lint (fmt + check + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
          docker-images: true

      # Restore-only: the keyed CI `lint` job owns the lbug C++ ccache save.
      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false

      # Share the keyed CI lint cache key so fork runs restore the warm
      # main-branch cache (forks can read base-repo caches, write to their own).
      - name: Cache cargo/target (lint)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-lint-v6

      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.13-cpu-linux-x86_64
      # A restored ORT cache that lost its libonnxruntime.a still makes ort-sys
      # skip the download; the failure then surfaces minutes later as the bare
      # rustc error "could not find native static library `onnxruntime`". Drop any
      # empty dist dir so ort-sys re-downloads -- and so this job's post-step
      # cannot persist the empty skeleton under the ORT key. Full write-up in
      # ci/ort/ensure-cache-usable.sh.
      - name: Ensure the restored ORT cache is usable
        shell: bash
        run: bash ci/ort/ensure-cache-usable.sh target/ort-cache

      - name: rustfmt (check)
        run: cargo fmt --all -- --check

      - name: Compilation check
        run: cargo check --all-targets

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── Secret-free workspace tests ───────────────────────────────────────
  test-no-secrets:
    name: Test (no secrets)
    runs-on: ubuntu-latest
    env:
      # Select the tuned nextest CI profile (.config/nextest.toml): parallel
      # execution, fail-fast off, and one retry for transient flakiness. The
      # keyed `test` job sets this too; without it a genuinely flaky test (e.g.
      # a span-capture race) that a single retry absorbs on the keyed lane would
      # fail this lane outright.
      NEXTEST_PROFILE: ci
      # Replay the cassette-converted integration tests offline from the
      # committed cassettes (crates/*/tests/fixtures/cassettes/) instead of
      # calling the live API — replay needs NO credentials, so these run on
      # this keyless lane exactly as they do on the keyed `test` job. The
      # remaining real-API tests detect the absent OPENAI_*/LLM_* env and skip
      # themselves. See docs/build/ci-test-parallelism.md / Approach E.
      COGNEE_TEST_REPLAY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false

      - name: Cache cargo/target (test)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test-v6
          cache-on-failure: true

      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.13-cpu-linux-x86_64
      # A restored ORT cache that lost its libonnxruntime.a still makes ort-sys
      # skip the download; the failure then surfaces minutes later as the bare
      # rustc error "could not find native static library `onnxruntime`". Drop any
      # empty dist dir so ort-sys re-downloads -- and so this job's post-step
      # cannot persist the empty skeleton under the ORT key. Full write-up in
      # ci/ort/ensure-cache-usable.sh.
      - name: Ensure the restored ORT cache is usable
        shell: bash
        run: bash ci/ort/ensure-cache-usable.sh target/ort-cache

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      # No OPENAI_* / LLM_* env is provided: the cassette-converted tests replay
      # offline (COGNEE_TEST_REPLAY=1 above), the remaining real-API tests skip
      # gracefully, and everything else runs.
      - name: Test (keyless)
        run: bash scripts/run_tests_no_secrets.sh

  # ── Postgres graph adapter tests (mirror of ci.yml's `pggraph-postgres`) ──
  # Belongs on this keyless lane because it genuinely needs no secrets: a
  # service container starts from a public image on fork runs exactly as it does
  # in-repo. Without it, the `PgGraphAdapter` suite would stay invisible to
  # community contributors — `run_tests_no_secrets.sh` cannot reach it, since
  # those tests are behind the non-default `postgres` cargo feature *and* the
  # `PGGRAPH_TEST_URL` gate.
  #
  # Fork PRs only — unlike `lint` / `test-no-secrets` above, which duplicate
  # their keyed counterparts on every PR. This lane costs ~15 min and a second
  # service container, and on an in-repo PR `ci.yml` already runs the identical
  # job, so duplicating it would double both the runner cost and the flake
  # surface (two required aggregators, either of which can fail on a transient
  # container start) for zero extra coverage — right after #129 went to some
  # trouble to cut PR wall-clock. The `notify` aggregator below therefore
  # accepts `skipped` for this job.
  #
  # The steps are a mirror of the ci.yml job; the part that actually matters,
  # the skip guard, is shared as `scripts/ci/assert_pg_suite_ran.sh` so it
  # cannot drift between the two copies.
  pggraph-postgres:
    name: Test (Postgres graph lane)
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name != github.repository

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cognee_test_graph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGGRAPH_TEST_URL: postgres://postgres:postgres@localhost:5432/cognee_test_graph

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false

      - name: Cache cargo/target (test, restore-only)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test-v6
          save-if: "false"

      # No ORT cache step — see the ci.yml twin: `cognee-graph` pulls in no
      # `ort-sys`, and an unguarded writer here can poison the shared ORT key.

      # `--success-output immediate` plus the guard step below: a skipped case
      # still reports `ok`, so the printed skip line is the only thing separating
      # a real run from a green no-op, and nextest would otherwise capture and
      # discard it on a passing test. nextest is safe here now that each case owns
      # its own throwaway database — see the ci.yml twin for the full history.
      #
      # Note there is deliberately no retry here, unlike `test-no-secrets`'s
      # `NEXTEST_PROFILE: ci`: a transient failure starting the Postgres service
      # container should be visible rather than absorbed, since a silently
      # retried infrastructure problem is how this suite went unexecuted for so
      # long — and a retry would equally mask a race, which is the exact class of
      # bug the per-test databases exist to rule out. Fork contributors who hit
      # one can push an empty commit to re-run.
      - name: Run PgGraphAdapter integration tests
        run: |
          set -o pipefail
          cargo nextest run -p cognee-graph --features postgres,testing \
            --test pg_graph_integration --success-output immediate --color never \
            2>&1 | tee pggraph-integration.log

      - name: Run PgGraphAdapter inline (lib) tests
        run: |
          set -o pipefail
          cargo nextest run -p cognee-graph --features postgres,testing \
            --lib --success-output immediate --color never \
            2>&1 | tee pggraph-lib.log

      # Pool-teardown regression tests (topoteretes/cognee-rs#132). This lane
      # invokes individual `--test` targets, so a new file is otherwise compiled
      # by nobody and run nowhere — which for a leak test means the leak comes
      # back silently.
      - name: Run PgGraphAdapter pool-close tests
        run: |
          set -o pipefail
          cargo test -p cognee-graph --features postgres,testing \
            --test pg_graph_close -- --nocapture 2>&1 | tee pggraph-close.log

      - name: Assert the suite really executed
        run: |
          bash scripts/ci/assert_pg_suite_ran.sh --label PgGraph \
            --log pggraph-integration.log --min-tests 31 \
            --log pggraph-lib.log         --min-tests 1 \
            --log pggraph-close.log --min-tests 3 \
            --require-test pggraph_coexists_with_relational_migrator_in_shared_db \
            --require-test pggraph_purges_legacy_row_from_default_table_on_upgrade \
            --require-test close_releases_the_pool_while_the_adapter_is_still_held

  # ── pgvector adapter tests (mirror of ci.yml's `pgvector-postgres`) ──
  # Keyless for the same reason as the graph lane above: a pgvector service
  # container starts from a public image on a fork runner exactly as it does
  # in-repo, and nothing here touches an LLM. Fork PRs only, and the `notify`
  # aggregator below therefore accepts `skipped` — see the graph lane's comment
  # for the full rationale.
  #
  # See the ci.yml twin for why this needs `--features pgvector,testing` (without
  # it the targets compile to zero tests and the lane reports green having run
  # nothing), why it stays on `cargo test` rather than nextest (the 24 integration
  # cases share one database and coordinate through `#[serial]`, which nextest's
  # per-test processes defeat), and why the image must be pgvector/pgvector.
  pgvector-postgres:
    name: Test (Postgres pgvector lane)
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name != github.repository

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cognee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_PROVIDER: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: cognee_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PGVECTOR_TEST_URL: postgres://postgres:postgres@localhost:5432/cognee_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false

      - name: Cache cargo/target (test, restore-only)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test-v6
          save-if: "false"

      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.13-cpu-linux-x86_64
      # A restored ORT cache that lost its libonnxruntime.a still makes ort-sys
      # skip the download; the failure then surfaces minutes later as the bare
      # rustc error "could not find native static library `onnxruntime`". Drop any
      # empty dist dir so ort-sys re-downloads -- and so this job's post-step
      # cannot persist the empty skeleton under the ORT key. Full write-up in
      # ci/ort/ensure-cache-usable.sh.
      - name: Ensure the restored ORT cache is usable
        shell: bash
        run: bash ci/ort/ensure-cache-usable.sh target/ort-cache

      - name: Run PgVectorAdapter integration tests
        run: |
          set -o pipefail
          cargo test -p cognee-vector --features pgvector,testing \
            --test pgvector_integration -- --nocapture 2>&1 | tee pgvector-integration.log

      - name: Run PgVectorAdapter inline (lib) tests
        run: |
          set -o pipefail
          cargo test -p cognee-vector --features pgvector,testing \
            --lib -- --nocapture 2>&1 | tee pgvector-lib.log

      - name: Run pgvector span instrumentation tests
        run: |
          set -o pipefail
          cargo test -p cognee-vector --features pgvector,testing \
            --test pgvector_span_instrumentation -- --nocapture 2>&1 | tee pgvector-spans.log

      # Floors: only the integration log carries a real count floor (20 against 24
      # macro-generated cases that are not named below). The other two get
      # `--min-tests 1` — enough to catch compiles-to-zero — because every case
      # that matters in them is named below, and 32 of the `--lib` target's 34
      # tests are unrelated unit tests. See the ci.yml twin for the full reasoning.
      # Pool-teardown regression tests (topoteretes/cognee-rs#132) — see the
      # PgGraph lane for why a named `--test` invocation is required.
      - name: Run PgVectorAdapter pool-close tests
        run: |
          set -o pipefail
          cargo test -p cognee-vector --features pgvector,testing \
            --test pgvector_close -- --nocapture 2>&1 | tee pgvector-close.log

      - name: Assert the suite really executed
        run: |
          bash scripts/ci/assert_pg_suite_ran.sh --label PgVector \
            --log pgvector-integration.log --min-tests 21 \
            --log pgvector-lib.log         --min-tests 1 \
            --log pgvector-spans.log       --min-tests 1 \
            --log pgvector-close.log --min-tests 2 \
            --require-test pgvector_coexists_with_relational_migrator_in_shared_db \
            --require-test pgvector_purges_legacy_row_from_default_table_on_upgrade \
            --require-test upsert_emits_pgvector_span \
            --require-test search_emits_pgvector_span \
            --require-test delete_emits_pgvector_span \
            --require-test close_releases_the_pool_while_the_adapter_is_still_held

  # ── Single-database Postgres stack (mirror of ci.yml's `pg-single-db-postgres`) ──
  # Two of the three suites in the keyed twin; `pg_full_stack_e2e` is deliberately
  # absent because it needs an LLM. Letting it run and skip here is not an option:
  # the skip line it prints is exactly what the guard treats as a failed lane, and
  # weakening the guard to tolerate that would reopen the hole this whole change
  # closes. Fork PRs only; `notify` accepts `skipped`.
  pg-single-db-postgres:
    name: Test (Postgres single-database lane)
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name != github.repository

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cognee_test_single
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/cognee_test_single

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false

      - name: Cache cargo/target (test, restore-only)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test-v6
          save-if: "false"

      # Needed here (unlike the graph lane): `cognee`'s default features include
      # `onnx`, so `ort-sys` is in the dep graph and the link step needs the
      # downloaded runtime.
      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.13-cpu-linux-x86_64
      # A restored ORT cache that lost its libonnxruntime.a still makes ort-sys
      # skip the download; the failure then surfaces minutes later as the bare
      # rustc error "could not find native static library `onnxruntime`". Drop any
      # empty dist dir so ort-sys re-downloads -- and so this job's post-step
      # cannot persist the empty skeleton under the ORT key. Full write-up in
      # ci/ort/ensure-cache-usable.sh.
      - name: Ensure the restored ORT cache is usable
        shell: bash
        run: bash ci/ort/ensure-cache-usable.sh target/ort-cache

      # `--features sqlite,postgres` — see the ci.yml twin: the non-Postgres case
      # in this file uses `sqlite::memory:`, and `cognee-database` has no default
      # features, so `--features postgres` alone fails it with "no supporting
      # driver".
      - name: Run provenance batch tests (Postgres cases)
        run: |
          set -o pipefail
          cargo test -p cognee-database --features sqlite,postgres \
            --test provenance_batch -- --nocapture 2>&1 | tee pg-provenance.log

      - name: Run single-database coexistence test
        run: |
          set -o pipefail
          cargo test -p cognee --test pg_shared_db_single_stack \
            -- --nocapture 2>&1 | tee pg-single-stack.log

      - name: Assert the suites really executed
        run: |
          bash scripts/ci/assert_pg_suite_ran.sh --label "Postgres single-database" \
            --log pg-provenance.log   --min-tests 3 \
            --log pg-single-stack.log --min-tests 1 \
            --require-test upsert_batch_with_duplicate_ids_dedups_keeping_last \
            --require-test temp_database_supports_back_to_back_initialize \
            --require-test relational_pgvector_pggraph_coexist_in_one_database

  # ── Aggregate status (single required check for branch protection) ────
  notify:
    name: Community Checks Status
    needs: [ lint, test-no-secrets, pggraph-postgres, pgvector-postgres, pg-single-db-postgres ]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Check status
        run: |
          # `skipped` is the expected result for the three Postgres lanes on an
          # in-repo PR, where they are gated off because ci.yml runs the same
          # lanes. Any other non-success value (failure / cancelled) must still
          # fail.
          if [[ "${{ needs.lint.result }}" == "success" &&
                "${{ needs.test-no-secrets.result }}" == "success" &&
                ( "${{ needs.pggraph-postgres.result }}" == "success" ||
                  "${{ needs.pggraph-postgres.result }}" == "skipped" ) &&
                ( "${{ needs.pgvector-postgres.result }}" == "success" ||
                  "${{ needs.pgvector-postgres.result }}" == "skipped" ) &&
                ( "${{ needs.pg-single-db-postgres.result }}" == "success" ||
                  "${{ needs.pg-single-db-postgres.result }}" == "skipped" ) ]]; then
            echo "All community checks passed!"
          else
            echo "One or more community checks failed."
            exit 1
          fi
