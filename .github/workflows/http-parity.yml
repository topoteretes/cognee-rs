name: HTTP Parity

# Re-enabled on push/PR (task 12): the Python alembic chain on a virgin SQLite
# DB is fixed via Option B1 in e2e-cross-sdk/bin/start_servers.sh — the
# harness pre-creates all ORM tables via create_database() and stamps alembic
# to head before uvicorn starts, so the lifespan migration is a no-op delta.
# Phase-1 deterministic checks + telemetry parity run without any secrets.
# LLM-gated phases use secrets.OPENAI_KEY (same as ci.yml) and skip cleanly
# when absent (fork-safe). Phase-3 specialty tests remain workflow_dispatch-only.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_phase3:
        description: "Run phase-3 specialty tests (websocket, sync, permissions, visualize)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: http-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-parity:
    runs-on: ubuntu-latest

    # HAS_OPENAI_KEY must be set at job level so step-level `if:` expressions
    # can read it via `env.HAS_OPENAI_KEY`.  A step's own `env:` block is only
    # visible to the `run:` script, NOT to the `if:` evaluator — setting it
    # only at step level means the gate always evaluates against '' (falsy) and
    # all LLM-gated steps would be permanently skipped even when the secret
    # is present.  Job-level `env:` supports the `secrets` context.
    env:
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_KEY != '' }}

    steps:
      # The Dockerfile copies from BOTH cognee-rust/ and cognee/ siblings
      # (multi-stage build: Rust binaries from this repo + Python venv from
      # the cognee Python repo), and docker-compose.yml uses `context: ../..`.
      # We replicate the local monorepo layout (`~/dev/cognee/{cognee-rust,cognee}`)
      # by checking both repos out as siblings under $GITHUB_WORKSPACE.
      - name: Checkout cognee-rust
        uses: actions/checkout@v4
        with:
          path: cognee-rust
          submodules: recursive

      # Pinned to a `dev`-branch SHA that ships the Ladybug shim (kuzu/ has
      # been re-exported from `ladybug` since 1.0.5). On `main` kuzu is still
      # a hard pip dep that's not installed in the harness venv, causing
      # `ModuleNotFoundError: No module named 'kuzu'` during alembic migrations.
      # Bump this SHA periodically; pinning beats `ref: dev` so upstream
      # churn can't silently break our CI.
      - name: Checkout cognee (Python sibling repo)
        uses: actions/checkout@v4
        with:
          repository: topoteretes/cognee
          ref: b9014c1661bff1d1d8bc831f3d31bc5a965bcaa3
          path: cognee

      # docker-compose.yml declares `env_file: ../.env`; missing files abort
      # `docker compose run`, so create an empty stub. Real env vars are
      # passed through process env in each phase.
      - name: Stub cognee-rust/.env (required by docker-compose env_file)
        run: touch cognee-rust/.env

      # ubuntu-latest ships with ~14 GB free; the release build plus the cargo
      # registry and target cache needs more headroom. Mirror ci.yml.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: true

      # ── Build the Rust binaries HERE, not inside the image ────────────────
      # The Dockerfile used to carry a builder stage that recompiled ~741
      # crates on every run — ~34 min of a ~39 min job — because its cargo
      # target dir lived in a `--mount=type=cache` that never survives a fresh
      # runner, and BuildKit layer caching was measured producing zero reuse
      # here even at an identical commit. Building on the runner lets
      # Swatinem/rust-cache persist the target dir instead, which is the one
      # caching mechanism this repo has proven works.
      #
      # Cold runs (first main run after a toolchain bump) cost about what the
      # in-image build did; warm runs skip nearly all of it.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      # cmake + protoc: lbug's bundled Ladybug C++ tree and the prost build.
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake protobuf-compiler

      # Restore-only, shared with ci.yml's lint job (the sole writer). ccache
      # keys on compiler+flags+source content, so this workspace's resolution
      # hits the same entries.
      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false

      # Its own key: this is a --release tree, disjoint from the debug caches
      # ci.yml keeps. Main-only save, matching the policy in ci.yml — branches
      # restore main's copy rather than minting a duplicate.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cognee-rust -> target
          shared-key: http-parity-release-v1
          # TEMPORARY (measurement only — revert before merge): lets this
          # branch write the release cache so the cold-vs-warm delta is
          # observable. Main-only, a branch never writes and so can never
          # demonstrate the warm path.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/perf/e2e-prebuilt-binaries' }}

      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: cognee-rust/target/ort-cache
          key: ort-v2.0.0-rc.12-cpu-linux-x86_64

      - name: Build release binaries
        working-directory: cognee-rust
        env:
          # ort-sys downloads the ONNX Runtime static library here; keeping it
          # under target/ is what lets the cache above pick it up.
          ORT_CACHE_DIR: ${{ github.workspace }}/cognee-rust/target/ort-cache
          CARGO_INCREMENTAL: "0"
        run: |
          # One invocation for all three: separate `cargo build -p X` calls
          # resolve features per-subgraph and build duplicate variants of
          # shared deps (that cost 44 min before it was fixed). `bin` gates the
          # http-server entry point; `dev-mock` gives the in-memory vector
          # store the single-node harness needs.
          cargo build --release \
            -p cognee-cli \
            -p cognee-http-server \
            -p cognee-telemetry-emit \
            --features cognee-http-server/bin,cognee-http-server/dev-mock
          mkdir -p dist
          cp target/release/cognee-cli \
             target/release/cognee-http-server \
             target/release/cognee-telemetry-emit \
             dist/
          ls -la dist/
          # Fail loudly here rather than at container start if something did
          # not link the way the harness image expects.
          ldd dist/cognee-http-server || true

      # NOTE on layer caching — measured and rejected, do not re-add blindly.
      #
      # There used to be an actions/cache step for /tmp/.buildx-cache here.
      # Nothing ever wrote that path (the compose build declares no
      # cache-from/cache-to), so it restored in 0s and saved in 0s on every run
      # and no buildx-http-parity-* key has ever existed. It is gone.
      #
      # A registry-backed replacement was then tried: an explicit
      # `docker buildx build` with --cache-from/--cache-to pointed at
      # ghcr.io (deliberately not `type=gha`, which shares the repo's already
      # exhausted 10 GB Actions quota). Measured across two runs at an
      # IDENTICAL commit — the best case a layer cache can ever get:
      #   cold (cache absent, import "not found"): build 2085s
      #   warm (cache present):                    build 2034s
      # i.e. ~zero reuse, against a +179s cache-export cost (152s preparing +
      # 27s sending). Net negative, so it was reverted.
      #
      # Why nothing was reused is still unexplained — the source was byte
      # identical and the dependency resolution was stable (the rust-cache dep
      # hash held at c4307474 across the same window). Worth understanding
      # before any further attempt; the likely suspects are the regenerated
      # Cargo.lock in the build context and the cache-mount RUN steps.
      #
      # ── Phase-1a: no LLM required (unconditional release gate) ─────────────
      # Excludes add/forget/search: the Python `/add` endpoint instantiates an
      # LLM client and raises LLMAPIKeyNotSetError without a key, so add (and
      # the forget/search tests that seed via add) need a key — they run in
      # Phase-1b. Running datasets without add in the same session also keeps
      # the dataset-list assertions free of add-created pollution.
      - name: Phase-1a — health, auth, datasets, openapi, errors (no LLM)
        run: >-
          docker compose
          -f cognee-rust/e2e-cross-sdk/docker-compose.yml
          run --rm e2e-http-tests
          pytest -vs /harness/
          -k "test_http_health or test_http_auth or test_http_datasets or test_http_openapi or test_http_errors or test_http_self"
          --tb=short

      # ── Phase-1b: add + forget + search (needs a key — Python /add does) ───
      # The `secrets` context does NOT populate job-level `env:` here (despite
      # the OPENAI_KEY secret existing, the HAS_OPENAI_KEY gate evaluated false
      # and this step always skipped). Secrets ARE available in a step's own
      # `env:`, so read the key there and gate inside the script instead of via
      # an `if:` expression (which cannot see step-level env).
      - name: Phase-1b — add, forget, search (LLM-gated)
        env:
          OPENAI_TOKEN: ${{ secrets.OPENAI_KEY }}
          OPENAI_URL: https://api.openai.com/v1
          OPENAI_MODEL: gpt-4o-mini
          LLM_PROVIDER: openai
          # Embedding config mirrors e2e-cross-sdk/harness/helpers.py (the proven
          # CLI cross-SDK setup). COGNEE_SKIP_CONNECTION_TEST bypasses Python's
          # 30s embedding-endpoint pre-check at /add time — ingestion does not
          # embed (that happens in cognify), so the check is unnecessary here.
          EMBEDDING_PROVIDER: openai
          EMBEDDING_MODEL: openai/text-embedding-3-small
          EMBEDDING_DIMENSIONS: "1536"
          EMBEDDING_API_KEY: ${{ secrets.OPENAI_KEY }}
          EMBEDDING_ENDPOINT: https://api.openai.com/v1
          COGNEE_SKIP_CONNECTION_TEST: "true"
        run: |
          if [ -z "${OPENAI_TOKEN}" ]; then
            echo "OPENAI_KEY not available — skipping LLM-gated add/forget/search parity."
            exit 0
          fi
          docker compose \
            -f cognee-rust/e2e-cross-sdk/docker-compose.yml \
            run --rm e2e-http-tests \
            pytest -vs /harness/ \
            -k "test_http_add or test_http_forget or test_http_search" \
            --tb=short

      # ── Telemetry parity: cross-SDK identity-layer comparison ────────────
      # Asserts api_key_tracking_id and persistent_id parity between the
      # Python and Rust SDKs. Uses the local `telemetry-proxy` service
      # (mock for test.prometh.ai) declared in docker-compose.yml — no
      # OPENAI_KEY required, no live network egress. The `e2e-telemetry`
      # service runs `pytest -vs /harness/test_telemetry_parity.py` against
      # both the Rust `cognee-telemetry-emit` binary and the Python SDK,
      # then diffs the captured payloads.
      - name: Telemetry parity (cross-SDK identity layers)
        run: >-
          docker compose
          -f cognee-rust/e2e-cross-sdk/docker-compose.yml
          run --rm e2e-telemetry

      # ── Phase-2: LLM-gated (requires OPENAI_KEY secret) ──────────────────
      # `env.HAS_OPENAI_KEY` is set at job level (see job env: block above).
      # Step-level `if:` can read job-level env; it cannot read step-level env.
      - name: Phase-2 — cognify, remember, recall, memify, improve, llm, hybrid (LLM-gated)
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        env:
          OPENAI_TOKEN: ${{ secrets.OPENAI_KEY }}
          OPENAI_URL: https://api.openai.com/v1
          OPENAI_MODEL: gpt-4o-mini
        run: >-
          docker compose
          -f cognee-rust/e2e-cross-sdk/docker-compose.yml
          run --rm e2e-http-tests
          pytest -vs /harness/
          -k "test_http_cognify or test_http_remember or test_http_recall or test_http_memify or test_http_improve or test_http_llm or test_http_hybrid"
          --tb=short

      # ── Cross-SDK provenance parity (LLM-gated) ─────────────────────────
      # Asserts gap-05 DataPoint provenance parity between Python and
      # Rust SDKs (source_pipeline / source_task / source_user). See
      # docs/telemetry/05-datapoint-provenance.md.
      - name: Provenance parity (LLM-gated)
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        env:
          OPENAI_TOKEN: ${{ secrets.OPENAI_KEY }}
          OPENAI_URL: https://api.openai.com/v1
          OPENAI_MODEL: gpt-4o-mini
        run: >-
          docker compose
          -f cognee-rust/e2e-cross-sdk/docker-compose.yml
          run --rm e2e-tests
          pytest -vs /harness/test_provenance_parity.py
          --tb=short

      # ── Cross-SDK logging parity (no LLM needed) ────────────────────────
      # Asserts gap-06 file-logging parity between Python and Rust SDKs:
      # loose per-filename presence, strict per-message byte equality.
      # See docs/telemetry/06-file-logging-rotation.md. The test itself
      # does not require OpenAI; we keep the HAS_OPENAI_KEY gate so this
      # step gracefully skips on forks/keyless pushes without the secret
      # (the build cost is only justified alongside the LLM-gated phases).
      # Phase-1 + telemetry parity remain the unconditional release gate.
      - name: Logging parity (no LLM needed)
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        run: >-
          docker compose
          -f cognee-rust/e2e-cross-sdk/docker-compose.yml
          run --rm e2e-tests
          pytest -vs /harness/test_logging_parity.py
          --tb=short

      # ── Phase-3: specialty (manual via workflow_dispatch only) ────────────
      - name: Phase-3 — websocket, sync, permissions, visualize (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_phase3 == 'true' }}
        env:
          OPENAI_TOKEN: ${{ secrets.OPENAI_KEY }}
          OPENAI_URL: https://api.openai.com/v1
          OPENAI_MODEL: gpt-4o-mini
        run: >-
          docker compose
          -f cognee-rust/e2e-cross-sdk/docker-compose.yml
          run --rm e2e-http-tests
          pytest -vs /harness/
          -k "test_http_websocket or test_http_sync or test_http_permissions or test_http_visualize"
          --tb=short
