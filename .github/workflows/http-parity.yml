name: Cross-SDK Parity

# Cross-SDK parity between the Python and Rust cognee SDKs, driven through the
# two CLIs and the on-disk databases they produce.
#
# The HTTP half of this lane is GONE from OSS. `cognee-http-server` moved out
# of this repository, taking the 28 `test_http_*.py` files, their fixtures and
# the dual-server entrypoint with it. What is left here is the CLI/DB lane: the COGX
# import + roundtrip contracts, telemetry parity, provenance parity and logging
# parity.
#
# The telemetry-parity and COGX-import steps need no secrets and are the
# unconditional release gate. LLM-gated steps use secrets.OPENAI_KEY (same as
# ci.yml) and skip cleanly when absent (fork-safe).
#
# The workflow file name, the job id `http-parity` and the concurrency group are
# deliberately UNCHANGED even though the HTTP half is gone, so that run history,
# branch-filter queries and any bookmark to this lane keep resolving. `main`
# carries no required status checks today (protection is a single approving
# review; no rulesets), so nothing is gated on this name right now — but the job
# has no `name:` key, so if a required context is ever configured for this lane
# it will be `http-parity`, and a rename would then have to be made on both
# sides at once.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Kept so the lane can still be re-run by hand. The `run_phase3` input it used
  # to carry is gone: phase 3 was entirely `test_http_*` specialty tests.
  workflow_dispatch:

concurrency:
  group: http-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-parity:
    runs-on: ubuntu-24.04

    # HAS_OPENAI_KEY must be set at job level so step-level `if:` expressions
    # can read it via `env.HAS_OPENAI_KEY`.  A step's own `env:` block is only
    # visible to the `run:` script, NOT to the `if:` evaluator — setting it
    # only at step level means the gate always evaluates against '' (falsy) and
    # all LLM-gated steps would be permanently skipped even when the secret
    # is present.  Job-level `env:` supports the `secrets` context.
    env:
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_KEY != '' }}

    steps:
      # The Dockerfile copies from BOTH cognee-rust/ and cognee/ siblings
      # (multi-stage build: Rust binaries from this repo + Python venv from
      # the cognee Python repo), and docker-compose.yml uses `context: ../..`.
      # We replicate the local monorepo layout (`~/dev/cognee/{cognee-rust,cognee}`)
      # by checking both repos out as siblings under $GITHUB_WORKSPACE.
      - name: Checkout cognee-rust
        uses: actions/checkout@v4
        with:
          path: cognee-rust
          submodules: recursive

      # Pinned to a `dev`-branch SHA that ships the Ladybug shim (kuzu/ has
      # been re-exported from `ladybug` since 1.0.5). On `main` kuzu is still
      # a hard pip dep that's not installed in the harness venv, causing
      # `ModuleNotFoundError: No module named 'kuzu'` during alembic migrations.
      # Bump this SHA periodically; pinning beats `ref: dev` so upstream
      # churn can't silently break our CI.
      - name: Checkout cognee (Python sibling repo)
        uses: actions/checkout@v4
        with:
          repository: topoteretes/cognee
          # cognee 1.6.5 on `dev` (2026-10-27). Bumped from 690c0ec (1.5.3,
          # 2026-08-24) for SDK-1039: that pin predated Python's SDK-1115
          # (triplet embedding, TRIPLET_COMPLETION and memify removed) and the
          # default embedding batch size of 32, both of which the Rust SDK now
          # follows. The pyproject's wheel package list (`cognee`,
          # `cognee_db_workers`, `kuzu`) and the `dlt` extra (now an empty
          # alias, dlt is a core dependency) still match the Dockerfile's
          # python-builder stage at this SHA.
          ref: 1d3ed15b1d7faf93af3ae7efff8167d164ee0847
          path: cognee

      # docker-compose.yml declares `env_file: ../.env`; missing files abort
      # `docker compose run`, so create an empty stub. Real env vars are
      # passed through process env in each phase.
      - name: Stub cognee-rust/.env (required by docker-compose env_file)
        run: touch cognee-rust/.env

      # Path contract for the build-context ignore file, in the spirit of
      # ci/assert-bindings-layout.sh.
      #
      # Docker resolves a bare `.dockerignore` at the CONTEXT ROOT, and this
      # build's context is the monorepo root — so a `.dockerignore` next to the
      # Dockerfile is silently inert. That was the state for months, and the only
      # symptom was a slower build nobody attributed to it. BuildKit does honour
      # `<dockerfile-name>.dockerignore`, so the name is load-bearing: renaming
      # or moving the Dockerfile orphans it just as quietly.
      - name: Assert the e2e build-context ignore contract
        run: |
          set -euo pipefail
          d=cognee-rust/e2e-cross-sdk
          if [ ! -f "$d/Dockerfile.dockerignore" ]; then
            echo "error: $d/Dockerfile.dockerignore is missing." >&2
            echo "       BuildKit reads it only under that exact name, beside $d/Dockerfile." >&2
            exit 1
          fi
          if [ -e "$d/.dockerignore" ]; then
            echo "error: $d/.dockerignore exists and is INERT — the context root is the" >&2
            echo "       monorepo root, so Docker never reads it. Fold its rules into" >&2
            echo "       $d/Dockerfile.dockerignore and delete it." >&2
            exit 1
          fi
          echo "ok: $d/Dockerfile.dockerignore present, no inert .dockerignore beside it"

      # The ubuntu-24.04 runner ships with ~14 GB free; the release build plus the cargo
      # registry and target cache needs more headroom. Mirror ci.yml.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: true

      # ── Build the Rust binaries on the runner, in the harness's base ──────
      # The Dockerfile used to carry a builder stage that recompiled ~741
      # crates on every run — ~34 min of a ~39 min job — because its cargo
      # target dir lived in a `--mount=type=cache` that never survives a fresh
      # runner, and BuildKit layer caching was measured producing zero reuse
      # here even at an identical commit. Building on the runner lets
      # Swatinem/rust-cache persist the target dir instead, which is the one
      # caching mechanism this repo has proven works.
      #
      # But a plain runner build links against the RUNNER's glibc, and the
      # binaries then run in the harness image: when ubuntu-latest became 26.04
      # (glibc 2.43) they failed there with `GLIBC_2.43 not found`. So the
      # compile runs in the Dockerfile's `rust-build-env` stage — the harness
      # base image plus C/C++ build deps — via
      # e2e-cross-sdk/build-rust-binaries.sh, the same script developers run
      # locally. It bind-mounts the checkout, rustup toolchain and cargo home at
      # their host paths, so the target dir stays on the runner for rust-cache
      # while glibc and libstdc++ are the harness's own, by construction; then
      # it checks both binaries load in the bare harness base.
      #
      # Cold runs (first main run after a toolchain bump) cost about what the
      # in-image build did; warm runs skip nearly all of it.
      #
      # The rustup toolchain is installed on the runner and only mounted into
      # the container. The official Rust toolchain binaries target glibc 2.17,
      # so they run in any recent Debian.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # No ccache step: the C/C++ compile happens in the container, where the
      # runner's ccache is not installed (scripts/ccache-launcher.sh then
      # passes straight through) and whose gcc would miss the host-gcc entries
      # ci.yml writes anyway. The lbug objects are still cached — as part of
      # the cargo target dir that rust-cache persists.

      # Its own key: this is a --release tree, disjoint from the debug caches
      # ci.yml keeps. Main-only save, matching the policy in ci.yml — branches
      # restore main's copy rather than minting a duplicate.
      #
      # v2 = the tree is now built with CARGO_PROFILE_RELEASE_DEBUG=0 (see the
      # build step). Bumped rather than reused so a debug=0 build can never
      # restore the older line-tables-only tree and thrash against it.
      # v4 = built inside rust-build-env (the harness's Debian, its gcc and
      # glibc) instead of on the ubuntu runner; a host-built tree's C/C++
      # objects must not be restored into it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cognee-rust -> target
          shared-key: http-parity-release-v4
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: cognee-rust/target/ort-cache
          key: ort-v2.0.0-rc.13-cpu-linux-x86_64
      # A restored ORT cache that lost its libonnxruntime.a still makes ort-sys
      # skip the download; the failure then surfaces minutes later as the bare
      # rustc error "could not find native static library `onnxruntime`". Drop any
      # empty dist dir so ort-sys re-downloads -- and so this job's post-step
      # cannot persist the empty skeleton under the ORT key. Full write-up in
      # ci/ort/ensure-cache-usable.sh.
      - name: Ensure the restored ORT cache is usable
        shell: bash
        run: bash cognee-rust/ci/ort/ensure-cache-usable.sh cognee-rust/target/ort-cache

      - name: Build release binaries (in the harness base) and check they load there
        env:
          # ort-sys downloads the ONNX Runtime static library here; keeping it
          # under target/ is what lets the cache above pick it up.
          ORT_CACHE_DIR: ${{ github.workspace }}/cognee-rust/target/ort-cache
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: always
          # Strip debug info for these binaries only. The workspace
          # release profile is `debug = "line-tables-only"`, which is right for
          # shipped artifacts but is a large share of the target dir — and this
          # cache is the single biggest addition to a 10 GB repo quota that is
          # already near its ceiling. An evicted cache costs a ~43-min cold run
          # instead of a ~9-min warm one, so size here directly buys
          # reliability of the speedup. (Measured with this setting on:
          # cold 42.6 min / warm 9.1 min / cache 0.92 GB, versus 54.1 / 11.3 /
          # 2.61 GB when the tree kept line-tables-only debug info.)
          #
          # The trade: backtraces out of the e2e harness lose line numbers.
          # That only affects this parity harness, never a released binary, and
          # a harness failure is reproduced by re-running the phase rather than
          # read off a stack trace.
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: bash cognee-rust/e2e-cross-sdk/build-rust-binaries.sh

      # NOTE on layer caching — measured and rejected, do not re-add blindly.
      #
      # There used to be an actions/cache step for /tmp/.buildx-cache here.
      # Nothing ever wrote that path (the compose build declares no
      # cache-from/cache-to), so it restored in 0s and saved in 0s on every run
      # and no buildx-http-parity-* key has ever existed. It is gone.
      #
      # A registry-backed replacement was then tried: an explicit
      # `docker buildx build` with --cache-from/--cache-to pointed at
      # ghcr.io (deliberately not `type=gha`, which shares the repo's already
      # exhausted 10 GB Actions quota). Measured across two runs at an
      # IDENTICAL commit — the best case a layer cache can ever get:
      #   cold (cache absent, import "not found"): build 2085s
      #   warm (cache present):                    build 2034s
      # i.e. ~zero reuse, against a +179s cache-export cost (152s preparing +
      # 27s sending). Net negative, so it was reverted.
      #
      # Why nothing was reused is still unexplained — the source was byte
      # identical and the dependency resolution was stable (the rust-cache dep
      # hash held at c4307474 across the same window). Worth understanding
      # before any further attempt; the likely suspect is the cache-mount RUN
      # steps. (An earlier version of this note also blamed the regenerated
      # Cargo.lock in the build context. That cannot have been a factor: the
      # Rust build left the image for the runner in #133, and
      # Dockerfile.dockerignore is an allowlist that never re-includes
      # Cargo.lock, so the lockfile does not enter the build context at all.)
      #
      # ── Telemetry parity: cross-SDK identity-layer comparison ────────────
      # Asserts api_key_tracking_id and persistent_id parity between the
      # Python and Rust SDKs. Uses the local `telemetry-proxy` service
      # (mock for test.prometh.ai) declared in docker-compose.yml — no
      # OPENAI_KEY required, no live network egress. The `e2e-telemetry`
      # service runs `pytest -vs /harness/test_telemetry_parity.py` against
      # both the Rust `cognee-telemetry-emit` binary and the Python SDK,
      # then diffs the captured payloads.
      - name: Telemetry parity (cross-SDK identity layers)
        run: >-
          docker compose
          -f cognee-rust/e2e-cross-sdk/docker-compose.yml
          run --rm e2e-telemetry

      # ── COGX import contract (no LLM, unconditional release gate) ────────
      # Python cognee imports a COGX archive written by the Rust exporter
      # (harness/golden/cogx_archive/, regenerated and drift-checked by
      # `cargo test -p cognee-migration --test python_import_contract`).
      #
      # Unconditional on purpose. The full roundtrip below needs a key because
      # producing a graph to export means cognify, so it never runs on a fork
      # PR — and every way this contract breaks is silent on the Python side:
      # a wrong manifest `source_system` downgrades id preservation, and a
      # missing raw node makes the loader skip edges with only a log warning.
      # Both yield a "successful" import of quietly wrong data.
      - name: COGX import contract — Python reads a Rust archive (no LLM)
        env:
          # Without this the suite *skips* when the Python image has no
          # migration package, and the step exits 0 having asserted nothing —
          # the `pgvector-spans` failure mode. Set here so a pin that cannot
          # run these tests fails the lane instead of quietly passing it.
          COGX_REQUIRE_PYTHON_SUPPORT: "1"
        # -e per invocation rather than in the service's `environment:`, so
        # this does not un-skip every other requires_openai test in the
        # service. See the note on e2e-tests in docker-compose.yml.
        run: |
          docker compose \
            -f cognee-rust/e2e-cross-sdk/docker-compose.yml \
            run --rm \
            -e COGX_REQUIRE_PYTHON_SUPPORT="$COGX_REQUIRE_PYTHON_SUPPORT" \
            e2e-tests \
            pytest -vs /harness/test_cogx_import_contract.py --tb=short

      # ── COGX roundtrip: Rust exports, Python imports (LLM-gated) ─────────
      # The end-to-end path: Rust add + cognify + `export --pack`, then Python
      # imports the archive and must reproduce the same node ids and edges.
      - name: COGX roundtrip — Rust export to Python import (LLM-gated)
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        env:
          OPENAI_TOKEN: ${{ secrets.OPENAI_KEY }}
          OPENAI_URL: https://api.openai.com/v1
          OPENAI_MODEL: gpt-4o-mini
          LLM_PROVIDER: openai
          # No EMBEDDING_* here on purpose: the Rust CLI embeds locally via the
          # image's ONNX model, and overriding that breaks cognify. See the
          # note on the e2e-tests service in docker-compose.yml.
        # -e per invocation rather than in the service's `environment:`, so
        # this does not un-skip every other requires_openai test in the
        # service. See the note on e2e-tests in docker-compose.yml.
        run: |
          docker compose \
            -f cognee-rust/e2e-cross-sdk/docker-compose.yml \
            run --rm \
            -e OPENAI_TOKEN="$OPENAI_TOKEN" \
            -e OPENAI_URL="$OPENAI_URL" \
            -e OPENAI_MODEL="$OPENAI_MODEL" \
            -e LLM_PROVIDER="$LLM_PROVIDER" \
            -e COGX_REQUIRE_PYTHON_SUPPORT=1 \
            e2e-tests \
            pytest -vs /harness/test_cogx_roundtrip.py --tb=short

      # ── Cross-SDK provenance parity (LLM-gated) ─────────────────────────
      # Asserts gap-05 DataPoint provenance parity between Python and
      # Rust SDKs (source_pipeline / source_task / source_user). See
      # docs/telemetry/05-datapoint-provenance.md.
      - name: Provenance parity (LLM-gated)
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        env:
          OPENAI_TOKEN: ${{ secrets.OPENAI_KEY }}
          OPENAI_URL: https://api.openai.com/v1
          OPENAI_MODEL: gpt-4o-mini
        run: >-
          docker compose
          -f cognee-rust/e2e-cross-sdk/docker-compose.yml
          run --rm e2e-tests
          pytest -vs /harness/test_provenance_parity.py
          --tb=short

      # ── Cross-SDK logging parity (no LLM needed) ────────────────────────
      # Asserts gap-06 file-logging parity between Python and Rust SDKs:
      # loose per-filename presence, strict per-message byte equality.
      # See docs/telemetry/06-file-logging-rotation.md. The test itself
      # does not require OpenAI; we keep the HAS_OPENAI_KEY gate so this
      # step gracefully skips on forks/keyless pushes without the secret
      # (the build cost is only justified alongside the LLM-gated phases).
      # Telemetry parity + the COGX import contract remain the unconditional
      # release gate.
      - name: Logging parity (no LLM needed)
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        run: >-
          docker compose
          -f cognee-rust/e2e-cross-sdk/docker-compose.yml
          run --rm e2e-tests
          pytest -vs /harness/test_logging_parity.py
          --tb=short

