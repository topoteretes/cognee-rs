name: CI

# Keyed test suite — requires repository secrets (OPENAI_KEY) for the LLM
# integration tests. GitHub does not pass secrets to `pull_request` runs from
# forks, so every job here is gated to in-repo refs (push / workflow_dispatch /
# same-repo PRs) via the `head.repo.full_name == github.repository` check on the
# entry jobs (`lint`, `msrv`); the rest cascade through `needs`. Fork PRs skip
# this workflow entirely and are covered by the fork-safe `Community Checks
# (No Secrets)` workflow instead. Mirrors the upstream Python cognee
# `test_suites.yml` / `community_tests.yml` split.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened ]
  # Twice-weekly cache warm-up on main. Since the cache saves below are main-only,
  # branches can only ever restore what a main run has already written — so
  # anything that invalidates main's caches leaves EVERY PR cold until main
  # next runs. Two things do that, and neither is rare:
  #
  #   1. Toolchain churn. The jobs here install `dtolnay/rust-toolchain@stable`,
  #      which sets RUSTUP_TOOLCHAIN and so overrides rust-toolchain.toml's
  #      `channel = "1.91.1"` pin (CI really runs current stable; the MSRV job is
  #      what covers 1.91.1). Every stable release therefore rotates the rustc
  #      component of every rust-cache key at once — observed going
  #      adf1a63c -> b33fdd40 while the dependency hash held at c4307474.
  #   2. The 7-day idle eviction. GitHub deletes any cache not *read* for a
  #      week, so a quiet week on main cools the whole repo by itself.
  #
  # Mon+Thu rather than daily. Case 1 is already covered on an active repo —
  # main is pushed to most days, and the first main run after a stable release
  # repopulates everything. Case 2 is the one normal activity cannot cover, and
  # a max 4-day gap sits comfortably under the 7-day eviction. Daily was the
  # first instinct but it would run the LLM-backed test lane every night for no
  # extra cache benefit; this costs ~2 cycles a week instead of 7.
  #
  # 03:11 UTC: off-peak, and deliberately not publish-dry-run.yml's 04:17 so
  # the two do not contend for runners.
  schedule:
    - cron: "11 3 * * 1,4"
  workflow_dispatch:

# The group must NOT include github.sha. With the sha in it, every push
# created a brand-new group, so cancel-in-progress had nothing to cancel and a
# superseded 40-65 min run kept occupying runners until it finished on its own.
# ios.yml, community.yml and http-parity.yml already key on the ref alone
# (and do show cancelled runs); CI showed none, which is how this surfaced.
#
# Scheduled runs get their OWN group. A cron fires with
# `github.ref == refs/heads/main`, so sharing the group meant the 03:11 warm-up
# cancelled any still-running post-merge run — main runs take 40-65 min, so
# anything merged after ~02:06 on a Mon/Thu was in range. That left the merge
# commit with a cancelled check (`notify` is gated on `!cancelled()`, so the
# aggregator did not even report) and skipped that run's main-only cache saves,
# which is the exact opposite of what the cron is for. Keying the cron
# separately keeps the invariant that only a newer push supersedes a main run,
# while two overlapping crons still collapse to the newest.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'scheduled-warmup' || github.ref }}
  cancel-in-progress: true

env:
  # Applied to all jobs so the shared rust-cache has consistent rustc
  # fingerprints. Keeping this workflow-wide prevents one job restoring
  # a cache built with a different debug level and triggering a mass
  # rebuild that blows out the runner disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Incremental state in target/incremental/ is useless on CI (each run
  # starts from a fresh checkout) and wastes 2-5 GB of runner disk.
  CARGO_INCREMENTAL: "0"
  # Redirect the ort-sys ONNX Runtime binary download into target/ so
  # Swatinem/rust-cache picks it up. Without this the binary lands in
  # ~/.cache/ort.pyke.io which Swatinem does NOT cache, causing a link
  # error on any job that gets a cache hit for target/ but a fresh runner
  # (the cached build script output points to the absent ~/.cache path).
  ORT_CACHE_DIR: ${{ github.workspace }}/target/ort-cache
  # ccache keys on the compiler binary by mtime by default; runner-image
  # updates touch /usr/bin/cc+gcc mtimes and would silently invalidate the
  # whole cache. Hash the compiler content instead.
  CCACHE_COMPILERCHECK: content

jobs:
  # ── Stage 1: Quick lints (fast fail) ──────────────────────────────────
  lint:
    name: Lint (fmt + check + clippy)
    runs-on: ubuntu-latest
    # In-repo only: fork PRs get no secrets and are covered by the
    # `Community Checks (No Secrets)` workflow. `test`, the Postgres lanes and
    # the binding-check jobs cascade off this gate via `needs`.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          # large-packages removes ^llvm-.* which takes out libclang; android-litert
          # bindgen needs libclang, so keep it.
          large-packages: false
          swap-storage: false
          docker-images: true

      # ccache for lbug's bundled Ladybug C++ build (~1000 compiler calls).
      # scripts/ccache-launcher.sh (wired via .cargo/config.toml [env]) picks
      # ccache up automatically once this action puts it on PATH. Cargo
      # relocates lbug's OUT_DIR whenever its build-dep closure (cc, cmake,
      # cxx-build, …) shifts in a fresh resolution — no lockfile is committed —
      # which otherwise forces a from-scratch C++ rebuild in every job at
      # once. See docs/build/lbug-rebuilds.md.
      # Only this job saves the cache: it is the root of the job DAG and
      # compiles the same objects the downstream jobs need (ccache keys on
      # compiler+flags+source content, not on cargo's unit hash, so even the
      # capi/js workspaces' independent resolutions hit the same entries).
      # Downstream jobs restore-only to avoid pushing six near-identical
      # caches per run into the 10 GB repo cache quota.
      - name: ccache (lbug bundled C++)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G

      # Lint has its own Swatinem key (workspace-lint-v6) separate from the
      # test job (workspace-test-v6). The lint job runs only `cargo check` /
      # `cargo clippy`, which produce .rmeta but NOT .rlib files. Sharing a
      # key with the test job would cause the test job to inherit a cache full
      # of .rmeta stubs and have to rebuild everything from scratch on every
      # run — including re-running the ort-sys build script that fetches the
      # ONNX Runtime static library.
      - name: Cache cargo/target (lint)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-lint-v6
          # Save only on main. Branch-scoped copies are what pushed the repo
          # over GitHub's 10 GB cache quota and kept the LRU rotating (see the
          # capi-check note below). Branches still *restore* main's caches;
          # they just stop writing a second copy. Note this only bites on PRs
          # that change the dependency graph — rust-cache skips the save
          # entirely on an exact key hit, so dependency-neutral PRs already
          # wrote nothing.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # ort-sys downloads the ONNX Runtime static library to ORT_CACHE_DIR
      # (target/ort-cache) during its build script. We cache it separately so
      # the first cold build of any job doesn't need to re-download it.
      # Key uses "cpu" to distinguish from a potential CUDA-enabled build.
      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.12-cpu-linux-x86_64

      - name: rustfmt (check)
        run: cargo fmt --all -- --check

      # Sub-second path-contract check for the bindings/ workspace. Lives in the
      # lint job rather than its own, because ts-prebuild.yml and
      # java-prebuild.yml never run on PRs and a dedicated job would cost a
      # runner to assert a handful of paths.
      - name: Check bindings layout contract
        run: bash ci/assert-bindings-layout.sh

      - name: Compilation check
        run: cargo check --all-targets

      # Use default features instead of --all-features.
      # --all-features activates ort-cuda / ort-tensorrt, which causes ort-sys
      # to download a separate ~100 MB CUDA-enabled ONNX Runtime static library
      # to a different hash path in target/ort-cache. That CUDA binary is never
      # used in CI (no GPU), but it bloats the cache and can produce a stale
      # rustc-link-search path that breaks the link step in the test job.
      # The former `--features android-litert,server` invocation was dropped
      # in T16: the `android-litert` LiteRT adapter moved to closed in T4 and
      # the `server` feature moved with the cloud commands in T15f, so OSS
      # no longer defines either feature.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # Telemetry feature is OFF by default per design decision 1, so the
      # default `cargo check --all-targets` above only covers the noop arm.
      # This step exercises the OTEL-on code path (init_telemetry, OTLP
      # exporter, tracing-opentelemetry bridge) at compile time.
      - name: Compilation check (telemetry feature)
        env:
          CARGO_TARGET_DIR: target/telemetry
        run: cargo check --all-targets --features telemetry

      # Mirror of the above for clippy. Catches cfg-gated lints that the
      # noop-arm clippy run cannot see. We pass the precise (default +
      # telemetry) combo a downstream user would enable via
      # `cargo build --features telemetry`.
      - name: clippy (telemetry feature)
        env:
          CARGO_TARGET_DIR: target/telemetry
        run: cargo clippy --all-targets --features telemetry -- -D warnings

      # Canary for cfg(not(feature = "telemetry")) drift: ensures the noop
      # path in cognee-observability compiles cleanly even if `default`
      # ever grows a transitive dep that accidentally enables telemetry.
      # Scoped to `-p cognee` to keep the build small (no rebuild of
      # the full workspace's binaries).
      - name: Compilation check (no default features)
        env:
          CARGO_TARGET_DIR: target/no-default
        run: cargo check -p cognee --no-default-features

      # Canary for the backend feature seams: a consumer that runs every store on
      # Postgres drops ort (onnx), the bundled ladybug C++ and the Arrow + lance
      # stack this way. Without this lane the `#[cfg(feature = ...)]` paths behind
      # those features rot and the seam silently stops building. Uses the
      # no-default target dir to keep these odd feature sets out of the main cache
      # (it shares little with the `-p cognee` lane above — different package and
      # features — but both are small check-only trees).
      - name: Compilation check (Postgres-only server)
        env:
          CARGO_TARGET_DIR: target/no-default
        run: |
          cargo check -p cognee-http-server --no-default-features \
            --features telemetry,html-loader,pgvector,pggraph

      # crates/vector declares no default features, so `cargo test -p cognee-vector`
      # runs none of the inline LanceDB adapter tests; only the workspace-wide
      # nextest run reaches them, via unification from `cognee`. Spell the lane out
      # so the adapter keeps its own coverage.
      - name: Test (cognee-vector lancedb lane)
        run: cargo test -p cognee-vector --features lancedb

      - name: License presence (every published crate)
        run: |
          cargo metadata --no-deps --format-version 1 \
          | python3 -c 'import sys,json;\
            p=json.load(sys.stdin)["packages"];\
            bad=[x["name"] for x in p if not x.get("license") and not x.get("license_file")];\
            print("missing license:",bad); sys.exit(1 if bad else 0)'

  # ── MSRV floor: build against the declared rust-version (T2.3) ─────────
  # rust-toolchain.toml pins the toolchain repo-wide (it takes precedence over
  # @stable), so every lane already builds on the floor; this lane additionally
  # installs 1.91.1 explicitly so a newer-than-MSRV API is caught before release
  # even if the pin moves.
  # Note: 1.89 is the real floor on x86_64 — the embedded qdrant `quantization`
  # crate uses AVX-512 target features/intrinsics (avx512vl, avx512vpopcntdq,
  # stdarch_x86_avx512) stabilized in Rust 1.89. (home@0.5.12 / icu_collections
  # already require 1.88; qdrant raises it to 1.89.) Edition 2024 + resolver 3
  # would allow 1.85 in principle. The aarch64 build never compiles the AVX-512
  # path, so this only manifests on x86_64.
  msrv:
    name: MSRV (1.91.1)
    runs-on: ubuntu-latest
    # In-repo only (no `needs`, so it carries its own gate). See `lint`.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.91.1
        uses: dtolnay/rust-toolchain@1.91.1

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
          docker-images: true

      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false

      - name: Cache cargo/target (msrv)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-msrv-v1
          cache-on-failure: true
          # main-only save — see the note in the lint job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.12-cpu-linux-x86_64

      - name: Check (MSRV)
        run: cargo +1.91.1 check --all-targets

  # ── wasm32 Config-1 lane: logic crates compile + run on wasm32 ────────
  # The wasm smoke-test files are #![cfg(target_arch = "wasm32")], so the native
  # lint/check lanes compile them to empty crates and never type-check them.
  # This lane builds the logic crates for wasm32-unknown-unknown, type-checks
  # every wasm test target (so a DocumentChunk-field or chunk_text-signature
  # drift fails CI), and runs the Node smoke test. The headless-browser runner
  # stays manual — it needs a WebDriver + browser; see docs/spike-wasm-config1.md.
  # No protoc/cmake/lbug here: the three logic crates pull none of them.
  wasm:
    name: wasm32 (Config-1 logic crates)
    runs-on: ubuntu-latest
    # In-repo only (no `needs`, so it carries its own gate). See `lint`. Needs no
    # secrets itself, but it belongs to the keyed workflow that fork PRs skip
    # wholesale — the fork-safe `Community Checks` workflow covers forks instead.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # rust-toolchain.toml pins the repo to 1.91.1, and that pin takes precedence
      # over @stable — so `cargo build --target wasm32-unknown-unknown` runs under
      # 1.91.1, not stable. The wasm32 std component must be on the *pinned*
      # toolchain. `rustup target add` honors the rust-toolchain.toml override
      # (exactly as scripts/check_all.sh does locally); the action's `targets:`
      # input adds it to @stable instead, which is why CI hit
      # `error[E0463]: can't find crate for std`.
      - name: Add wasm32 target to the pinned toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: Install Node (for the wasm-bindgen test runner)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache cargo/target (wasm)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-v1
          # main-only save — see the note in the lint job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Build first so Cargo.lock exists (it is gitignored) before we pin the
      # runner to the resolved wasm-bindgen version below.
      - name: Build logic crates (wasm32)
        run: |
          cargo build -p cognee-models -p cognee-utils --target wasm32-unknown-unknown
          cargo build -p cognee-chunking --no-default-features --features tiktoken --target wasm32-unknown-unknown

      # Drift guard: type-check every wasm test target. --no-run needs no runner,
      # so it works before wasm-bindgen-cli is installed.
      - name: Type-check wasm test targets (drift guard)
        run: |
          # utils/models have no wasm-specific tests, but this compiles their wasm
          # *test* build — which is what this PR's tokio dev-dep split (utils) and
          # the cfg(not(wasm32)) gates on the retry (utils) and data_input (models)
          # test modules exist to keep green. `cargo build` only covers the lib, so
          # without this a regression to those gates stays invisible until someone
          # runs the wasm tests by hand.
          cargo test -p cognee-utils -p cognee-models --target wasm32-unknown-unknown --no-run
          # chunking under BOTH feature configs: the shared wasm_smoke module has a
          # #[cfg(feature = "tiktoken")] arm, and the no-feature build of
          # tests/wasm.rs is otherwise only ever exercised by the live Node step
          # below (which depends on the wasm-bindgen-cli install). A renamed
          # DocumentChunk field or a changed chunk_text signature breaks here.
          # Always spell chunking's wasm feature set explicitly with
          # --no-default-features [--features tiktoken] — identical to the build
          # step and check_all.sh — so the checks can't diverge if `default` grows.
          cargo test -p cognee-chunking --no-default-features --target wasm32-unknown-unknown --no-run
          cargo test -p cognee-chunking --no-default-features --features tiktoken --target wasm32-unknown-unknown --no-run

      # wasm-bindgen-test-runner must match the resolved wasm-bindgen crate
      # exactly or it refuses to run; read the version from the just-generated lock.
      - name: Install wasm-bindgen-test-runner (matching the locked version)
        run: |
          WB_VER=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p}' Cargo.lock)
          echo "Installing wasm-bindgen-cli $WB_VER"
          cargo install wasm-bindgen-cli --version "$WB_VER" --locked

      - name: Run Node smoke tests (no-features + tiktoken)
        run: |
          cargo test -p cognee-chunking --no-default-features --target wasm32-unknown-unknown --test wasm
          cargo test -p cognee-chunking --no-default-features --features tiktoken --target wasm32-unknown-unknown --test wasm

  # ── Stage 2: Build and run tests (depends on lint) ────────────────────
  test:
    name: Test (stable)
    needs: lint
    runs-on: ubuntu-latest

    env:
      OPENAI_URL: https://api.openai.com/v1
      OPENAI_TOKEN: ${{ secrets.OPENAI_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      # Select the tuned nextest CI profile (.config/nextest.toml): parallel
      # execution, fail-fast off, one retry for transient external flakiness.
      # nextest reads NEXTEST_PROFILE natively, so scripts/run_tests_with_openai.sh
      # needs no extra flags.
      NEXTEST_PROFILE: ci
      # Run cassette-converted integration tests offline from committed cassettes
      # (crates/*/tests/fixtures/cassettes/) instead of calling the live OpenAI
      # API. Tests still on the real API ignore this var and use OPENAI_TOKEN.
      # Cassettes are re-recorded on demand via the record-cassettes workflow.
      # See docs/build/ci-test-parallelism.md / Approach E.
      COGNEE_TEST_REPLAY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      # Restore-only: the lint job saves the shared lbug C++ ccache (see the
      # comment there).
      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false

      # The test job has its own Swatinem key (workspace-test-v6) separate from
      # lint (workspace-lint-v6). The test job runs `cargo nextest` which
      # compiles everything to .rlib for linking. On the first run this is a
      # cold build (~15 min), but workspace-test-v6 is then populated with
      # .rlib files and subsequent runs are fast. cache-on-failure=true ensures
      # even a first-run compile failure seeds the cache so the rerun is warm.
      - name: Cache cargo/target (test)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test-v6
          cache-on-failure: true
          # main-only save — see the note in the lint job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.12-cpu-linux-x86_64

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      # Verify that the ORT binary was correctly restored before compilation.
      # This step is intentionally non-blocking (|| true) — it only prints
      # diagnostics so CI logs show exactly what is (or isn't) in the cache.
      - name: Verify ORT binary cache
        run: |
          echo "=== ORT_CACHE_DIR: ${ORT_CACHE_DIR} ==="
          if [ -d "${ORT_CACHE_DIR}/dfbin" ]; then
            find "${ORT_CACHE_DIR}/dfbin" -type f | sort
            echo "=== sizes ==="
            du -sh "${ORT_CACHE_DIR}/dfbin"/*/*/ 2>/dev/null || true
          else
            echo "(dfbin directory not found — ort-sys will download on first build)"
          fi

      - name: Test
        run: bash scripts/run_tests_with_openai.sh

  # ── Stage 2.5: Docs + feature-variant lanes (depends on lint, parallel with `test`) ──
  # Moved out of the `test` job so they run concurrently with it instead of
  # serially after the workspace test run. Together these were ~14 min of the
  # test job's wall time (the two `cargo doc` builds ≈ 11 min, the telemetry /
  # no-default test lanes ≈ 3 min); off the test critical path they no longer
  # gate the downstream binding jobs. None of these need OpenAI credentials.
  docs-and-extras:
    name: Docs + feature lanes
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      # cmake + protoc are needed by lbug's bundled C++ build (via cognee).
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake protobuf-compiler

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
          docker-images: true

      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false

      # Restore the test job's cache read-only (it has the compiled rlibs the
      # doc/feature builds reuse). save-if:false so this parallel job never races
      # the `test` job's save of the same key.
      - name: Cache cargo/target (test, restore-only)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test-v6
          save-if: "false"

      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.12-cpu-linux-x86_64

      # Telemetry-feature test lane. The integration test from task 01-10
      # spawns an in-process tonic gRPC server on 127.0.0.1:0; no external
      # OTLP collector is needed. Covers both the OTEL crate
      # (cognee-observability) and the product-analytics crate
      # (cognee-telemetry, gap 02). TELEMETRY_DISABLED=1 is set globally
      # for belt-and-braces network isolation: the mockito-driven
      # integration tests (byte_parity, dispatch_with_mockito) explicitly
      # opt back in via COGNEE_TELEMETRY_INTEGRATION_TEST and inject the
      # mockito URL, while every other code path stays disabled so no
      # accidental egress to the live test.prometh.ai proxy can occur.
      - name: Test (telemetry feature, observability + telemetry crates)
        env:
          CARGO_TARGET_DIR: target/telemetry
          TELEMETRY_DISABLED: "1"
        run: |
          cargo test -p cognee-observability --features telemetry -- --nocapture
          cargo test -p cognee-telemetry --features telemetry -- --nocapture

      # Noop-fallback test lane for the cognee-telemetry crate. Exercises
      # crates/telemetry/tests/noop_fallback.rs (task 02-08) so we catch
      # cfg(not(feature = "telemetry")) drift at *runtime*, not just at
      # compile time.
      - name: Test (no default features, telemetry crate noop fallback)
        env:
          CARGO_TARGET_DIR: target/no-default
        run: cargo test -p cognee-telemetry --no-default-features -- --nocapture

      # RUSTDOCFLAGS=-W missing_docs surfaces undocumented public items as
      # rustdoc warnings (task 23) without failing the `clippy -- -D warnings`
      # gate. The lint is scoped to the doc job (not a crate `#![warn]`
      # attribute) precisely because a crate-level `#![warn(missing_docs)]`
      # would be promoted to an error by `-D warnings` and break the build,
      # whereas `cargo doc` runs without `-D warnings` and only warns.
      - name: Build docs
        env:
          # `--cfg docsrs` activates the `#[cfg(docsrs)]` doc-attribute paths
          # added in T10b (e.g. `#[doc(cfg(feature = "..."))]` feature labels)
          # so CI exercises the same rustdoc rendering crates.io will use.
          RUSTDOCFLAGS: -W missing_docs --cfg docsrs
        run: cargo doc --no-deps

      # Optional: rustdoc with the telemetry feature on, to catch
      # cfg(feature = "telemetry") doc-link breakage from task 01-11.
      - name: Build docs (telemetry feature)
        env:
          CARGO_TARGET_DIR: target/telemetry
          RUSTDOCFLAGS: -W missing_docs --cfg docsrs
        run: cargo doc --no-deps --features telemetry

  # ── Stage 2.5: pgvector adapter tests (depends on lint, runs in parallel with `test`) ──
  # Everything in `cognee-vector` that needs a live Postgres with the `vector`
  # extension: the 24-case `pgvector_integration` suite, the two inline
  # shared-database migration cases, and the three span-attribute cases.
  #
  # This lane is the former `pgvector-spans` / "Test (Postgres span lane)", which
  # ran `cargo test -p cognee-vector --test pgvector_span_instrumentation` with no
  # `--features` flag. That target is `#![cfg(feature = "pgvector")]` and
  # `cognee-vector` has no `default` feature list, so the file compiled away
  # entirely: libtest reported `running 0 tests`, the step exited 0, and the lane
  # reported green from the day it was created without ever executing a single
  # test — while paying for a pgvector service container to sit idle. The
  # `--features pgvector,testing` below is the fix, and the guard step at the end
  # is what stops it silently regressing: a test-count floor catches the
  # zero-test case that no skip marker would reveal.
  #
  # The renamed lane also folds in the `PGVECTOR_TEST_URL` suites, which had the
  # separate problem that no CI job ever supplied that variable. #128 chose *not*
  # to fold the pggraph suites into the span lane, but its reason was that doing
  # so would falsify a comment about per-method span instrumentation being
  # deferred for `pg_graph_adapter` — a statement about the graph adapter, not
  # about test lanes. There is no such conflict here: these are the same crate,
  # the same feature set, and the same server, so a second job would only pay a
  # second container start and a second build of the same crate. The span-scope
  # note that used to live here is preserved in the `pggraph-postgres` lane below,
  # which is where it is now relevant.
  #
  # Both variables point at the same database. `DB_*` drives
  # `cognee_test_utils::pg_test_url()` (the span tests); `PGVECTOR_TEST_URL` is
  # read directly (integration + inline). Nothing in this lane provisions its own
  # database except the two inline migration cases, so the steps below run
  # sequentially and share one.
  #
  # `cargo test`, not `cargo nextest`, and that is load-bearing: the 24
  # integration cases share one database and coordinate through `#[serial]`,
  # which only serializes within a single process. nextest gives each test its own
  # process, where the attribute cannot help — exactly the failure that made #136
  # give the pggraph suites per-test databases before its lane could move to
  # nextest. `--nocapture` is equally load-bearing: a skipped case still prints
  # `ok`, so the skip line is the only runtime signal, and the guard needs it.
  pgvector-postgres:
    name: Test (Postgres pgvector lane)
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector, not stock postgres: `PgVectorAdapter::new` runs
        # `CREATE EXTENSION IF NOT EXISTS vector` on startup, which fails on an
        # image that does not ship the extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cognee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_PROVIDER: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: cognee_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Named directly in POSTGRES_DB above rather than created by an extra
      # `CREATE DATABASE` step — a service container creates exactly one database.
      PGVECTOR_TEST_URL: postgres://postgres:postgres@localhost:5432/cognee_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false

      # Restore-only: this lane runs one small `cargo test -p cognee-vector`,
      # fully covered by the `test` job's debug build of the same key. Saving
      # here only added a divergent version of workspace-test-v6 (cache churn),
      # so it restores but does not save.
      - name: Cache cargo/target (test, restore-only)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test-v6
          save-if: "false"

      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.12-cpu-linux-x86_64

      - name: Run PgVectorAdapter integration tests
        run: |
          set -o pipefail
          cargo test -p cognee-vector --features pgvector,testing \
            --test pgvector_integration -- --nocapture 2>&1 | tee pgvector-integration.log

      # The shared-DB migration and legacy-purge cases live inline in the crate,
      # not in the integration file, so they need their own invocation.
      - name: Run PgVectorAdapter inline (lib) tests
        run: |
          set -o pipefail
          cargo test -p cognee-vector --features pgvector,testing \
            --lib -- --nocapture 2>&1 | tee pgvector-lib.log

      - name: Run pgvector span instrumentation tests
        run: |
          set -o pipefail
          cargo test -p cognee-vector --features pgvector,testing \
            --test pgvector_span_instrumentation -- --nocapture 2>&1 | tee pgvector-spans.log

      # Without this, dropping `--features pgvector` (back to the zero-test state
      # this lane shipped in) or losing the URL would leave the lane green while
      # executing nothing. The logic lives in a script so this lane and its
      # community.yml mirror cannot drift, and so it can be tested against
      # captured logs.
      #
      # Only the integration log carries a real count floor, and it has headroom
      # (20 against 24 cases): those 24 come from a `pgvector_test!` macro and are
      # not named individually below, so the floor is the only thing standing
      # between a feature-flag regression and a green lane. The other two logs get
      # `--min-tests 1` — enough to catch the compiles-to-zero case, which is the
      # floor's actual job — because every case that matters in them IS named
      # below, and a floor tight enough to notice one disappearing would fire on
      # unrelated churn instead. That is not hypothetical for the `--lib` target:
      # 32 of its 34 tests are brute-force/mock/node-filter unit tests with no
      # connection to Postgres, so a floor near the total would fail this lane for
      # someone relocating a mock test, and blame "the feature flags have probably
      # stopped applying". The deleted `assert_pggraph_suite_ran.sh` reached the
      # same conclusion ("the lib target holds 20-odd unrelated unit tests, so a
      # count floor would not notice these two disappearing") and the
      # `pggraph-postgres` lane below still passes `--min-tests 1` for it.
      # Pool-teardown regression tests (topoteretes/cognee-rs#132) — see the
      # PgGraph lane for why a named `--test` invocation is required.
      - name: Run PgVectorAdapter pool-close tests
        run: |
          set -o pipefail
          cargo test -p cognee-vector --features pgvector,testing \
            --test pgvector_close -- --nocapture 2>&1 | tee pgvector-close.log

      - name: Assert the suite really executed
        run: |
          bash scripts/ci/assert_pg_suite_ran.sh --label PgVector \
            --log pgvector-integration.log --min-tests 20 \
            --log pgvector-lib.log         --min-tests 1 \
            --log pgvector-spans.log       --min-tests 1 \
            --log pgvector-close.log --min-tests 2 \
            --require-test pgvector_coexists_with_relational_migrator_in_shared_db \
            --require-test pgvector_purges_legacy_row_from_default_table_on_upgrade \
            --require-test upsert_emits_pgvector_span \
            --require-test search_emits_pgvector_span \
            --require-test delete_emits_pgvector_span \
            --require-test close_releases_the_pool_while_the_adapter_is_still_held

  # ── Stage 2.5: single-database Postgres stack (depends on lint, parallel with `test`) ──
  # The `TEST_POSTGRES_URL` suites, which no CI job ever supplied that variable
  # to, so all four cases below had never executed:
  #
  #   crates/database/tests/provenance_batch.rs      (2 Postgres cases)
  #   crates/lib/tests/pg_shared_db_single_stack.rs  (1 case)
  #   crates/lib/tests/pg_full_stack_e2e.rs          (1 case, needs an LLM)
  #
  # `TEST_POSTGRES_URL` is deliberately distinct from the `DB_*` vars that drive
  # `pg_test_url()`: these suites target one Postgres *server* for the
  # "everything in one database" deployment (relational + pgvector +
  # Postgres-graph sharing a single database), and each case provisions its own
  # throwaway database off that server via
  # `cognee_test_utils::create_temp_postgres_db`.
  #
  # A sibling of `pgvector-postgres` rather than more steps in it: that lane
  # builds only `cognee-vector` with two features, whereas these suites build
  # `cognee` with its full default feature set (onnx/ort, lancedb, pdfium) — the
  # long pole. Sequencing them behind the small build would add the whole
  # `cognee` compile to this stage's wall clock instead of overlapping it, and a
  # second service container costs nothing (a public image, no secrets).
  #
  # The pgvector image again: `pg_shared_db_single_stack` and `pg_full_stack_e2e`
  # both initialize `PgVectorAdapter`, which runs `CREATE EXTENSION ... vector`.
  pg-single-db-postgres:
    name: Test (Postgres single-database lane)
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Not the database the tests write to: it is the one the URL connects
          # *through* to reach the server, from where each case creates a
          # throwaway database of its own and drops it again. The default
          # `postgres` superuser has the `CREATEDB` right that
          # `create_temp_postgres_db` requires.
          POSTGRES_DB: cognee_test_single
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/cognee_test_single

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false

      - name: Cache cargo/target (test, restore-only)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test-v6
          save-if: "false"

      # Unlike the pggraph lane, this one DOES need the ORT cache: `cognee`'s
      # default features include `onnx`, so `ort-sys` is in the dep graph and the
      # link step needs the downloaded runtime. Same key as the `test` lane.
      - name: Cache ORT binary
        uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.12-cpu-linux-x86_64

      # `--features sqlite,postgres`, not `--features postgres`: `cognee-database`
      # declares no default features, and the third (non-Postgres) case in this
      # file connects to `sqlite::memory:`, which fails with "has no supporting
      # driver" when only the Postgres driver is compiled in. The workspace `test`
      # lane never noticed because feature unification with `cognee` turns both on.
      - name: Run provenance batch tests (Postgres cases)
        run: |
          set -o pipefail
          cargo test -p cognee-database --features sqlite,postgres \
            --test provenance_batch -- --nocapture 2>&1 | tee pg-provenance.log

      - name: Run single-database coexistence test
        run: |
          set -o pipefail
          cargo test -p cognee --test pg_shared_db_single_stack \
            -- --nocapture 2>&1 | tee pg-single-stack.log

      # Keyed step: the only one of these suites that needs an LLM. It is absent
      # from the community.yml mirror rather than allowed to skip there, because a
      # skip would print the marker the guard below treats as a failure — and
      # rightly so: "the key is missing" and "the URL never arrived" are
      # indistinguishable in a log.
      #
      # Embeddings come from the same OPENAI_KEY account. This test used to
      # additionally require COGNEE_E2E_EMBED_MODEL_PATH / _TOKENIZER_PATH
      # (BGE-Small ONNX), which no job downloads — that requirement is what kept
      # it unrunnable in CI, and it is now optional (see the test's module doc).
      - name: Run full-stack Postgres e2e (LLM)
        env:
          OPENAI_URL: https://api.openai.com/v1
          OPENAI_TOKEN: ${{ secrets.OPENAI_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          set -o pipefail
          cargo test -p cognee --test pg_full_stack_e2e \
            -- --nocapture 2>&1 | tee pg-full-stack.log

      - name: Assert the suites really executed
        run: |
          bash scripts/ci/assert_pg_suite_ran.sh --label "Postgres single-database" \
            --log pg-provenance.log   --min-tests 3 \
            --log pg-single-stack.log --min-tests 1 \
            --log pg-full-stack.log   --min-tests 1 \
            --require-test upsert_batch_with_duplicate_ids_dedups_keeping_last \
            --require-test temp_database_supports_back_to_back_initialize \
            --require-test relational_pgvector_pggraph_coexist_in_one_database \
            --require-test pg_full_stack_add_and_cognify

  # ── Stage 2.5: Postgres graph adapter tests (depends on lint, parallel with `test`) ──
  # `crates/graph/tests/pg_graph_integration.rs` and the two inline
  # `shared_db_migration_tests` cases in `pg_graph_adapter.rs` all return early
  # unless `PGGRAPH_TEST_URL` points at a live Postgres, so until this lane
  # existed the whole `PgGraphAdapter` suite had never executed once — the
  # `created_at` plumbing that the visualization Memory tab depends on was
  # proven only for the Ladybug backend.
  #
  # Deliberately a sibling of `pgvector-postgres` rather than extra steps in it:
  # `pg_graph_adapter` has no per-method span instrumentation to exercise —
  # that was deferred in 04-08 pending a fan-in refactor, since the public
  # `query` is a stub returning `QueryError("not supported")`. Its lane also runs
  # nextest against per-test databases where the pgvector lane must stay on
  # `cargo test` for `#[serial]`, and needs no `vector` extension, so stock
  # `postgres:16` is enough.
  #
  # No secrets and no extensions: a service container spins up from a public
  # image on every runner (forks included), and `PgGraphAdapter` is plain
  # sea-orm over ordinary tables — no `CREATE EXTENSION` anywhere — so stock
  # `postgres:16` is enough. Mirrored in `community.yml` for fork PRs.
  pggraph-postgres:
    name: Test (Postgres graph lane)
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        # Stock Postgres, not pgvector/pgvector — the graph path needs no
        # extensions. `POSTGRES_DB` is no longer the database the tests write to:
        # it is the one the URL connects *through* to reach the server, from
        # where each case creates a throwaway database of its own and drops it
        # again. Still no `CREATE DATABASE` step needed — the suite does that
        # itself, and the default `postgres` superuser has the `CREATEDB` right
        # `create_temp_postgres_db` requires.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cognee_test_graph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGGRAPH_TEST_URL: postgres://postgres:postgres@localhost:5432/cognee_test_graph

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        with:
          make-default: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false

      # Restore-only for the same reason as `pgvector-postgres`: this lane builds
      # one crate with a non-default feature set, so saving under the shared key
      # would only fork a divergent copy of workspace-test-v6.
      - name: Cache cargo/target (test, restore-only)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test-v6
          save-if: "false"

      # No ORT cache step here on purpose. `cognee-graph` pulls in no `ort-sys`
      # (checked with `cargo tree -p cognee-graph --features postgres,testing`),
      # so this lane would never populate `target/ort-cache` — but
      # `actions/cache` saves on the post-step whenever the key misses, so it
      # could win the race to store a near-empty cache under the shared ORT key
      # right after that key is rotated. The real save from `test` is then
      # refused with "Cache already exists", and every later `test` run restores
      # a target/ whose ort-sys build-script output points into an empty
      # ort-cache — the link failure described at the top of this file.

      # `--success-output immediate` is load-bearing, and is this lane's
      # replacement for the `--nocapture` it used to pass libtest. A skipped
      # `pggraph_test!` case still reports `ok`, so the printed
      # `PGGRAPH_TEST_URL not set — skipping` line is the only signal separating
      # a real run from a green no-op — and nextest captures a *passing* test's
      # output by default, which would swallow precisely that line and disarm the
      # guard below. `--color never` keeps the logs parseable regardless of what
      # nextest infers about the terminal. The logs are kept for the guard step.
      #
      # This lane runs nextest like every other test lane in the repo. It used to
      # insist on `cargo test`, and had to: all 34 cases shared the single
      # `cognee_test_graph` database and wiped it on entry, which was only safe
      # because `cargo test` runs the whole binary in one process, where the
      # `#[serial]` attributes could actually serialize. nextest gives each test
      # its own process, where an in-process lock cannot help — and it duly
      # failed 33 of 59 cases with `relation "graph_edge" does not exist`. Each
      # case now provisions its own throwaway database via
      # `cognee_test_utils::create_temp_postgres_db` and drops it again, so there
      # is no shared state left to race on and no `#[serial]` anywhere.
      #
      # Deliberately no `NEXTEST_PROFILE: ci`: that profile retries a failed test
      # once, and a lane whose whole premise is that the races are gone must not
      # paper over a residual one.
      - name: Run PgGraphAdapter integration tests
        run: |
          set -o pipefail
          cargo nextest run -p cognee-graph --features postgres,testing \
            --test pg_graph_integration --success-output immediate --color never \
            2>&1 | tee pggraph-integration.log

      # The shared-DB migration and legacy-purge cases live inline in the crate,
      # not in the integration file, so they need their own invocation.
      - name: Run PgGraphAdapter inline (lib) tests
        run: |
          set -o pipefail
          cargo nextest run -p cognee-graph --features postgres,testing \
            --lib --success-output immediate --color never \
            2>&1 | tee pggraph-lib.log

      # Without this, a future change that stops the URL reaching the test
      # process (renamed env var, service container failing to bind) would leave
      # this lane reporting green while every case inside it skips. The logic
      # lives in a script rather than inline so this lane and its community.yml
      # mirror cannot drift, and so it can be tested against captured logs.
      # Pool-teardown regression tests (topoteretes/cognee-rs#132). This lane
      # invokes individual `--test` targets, so a new file is otherwise compiled
      # by nobody and run nowhere — which for a leak test means the leak comes
      # back silently.
      - name: Run PgGraphAdapter pool-close tests
        run: |
          set -o pipefail
          cargo test -p cognee-graph --features postgres,testing \
            --test pg_graph_close -- --nocapture 2>&1 | tee pggraph-close.log

      - name: Assert the suite really executed
        run: |
          bash scripts/ci/assert_pg_suite_ran.sh --label PgGraph \
            --log pggraph-integration.log --min-tests 30 \
            --log pggraph-lib.log         --min-tests 1 \
            --log pggraph-close.log --min-tests 3 \
            --require-test pggraph_coexists_with_relational_migrator_in_shared_db \
            --require-test pggraph_purges_legacy_row_from_default_table_on_upgrade \
            --require-test close_releases_the_pool_while_the_adapter_is_still_held

  # ── Stage 3: Language binding checks (depend on lint, parallel with `test`) ──
  # Gated on `lint` (not `test`) so the binding builds run concurrently with the
  # workspace test run instead of serially after it — the C API job in particular
  # is a long pole (~13–40 min) that previously started only once `test` finished.
  # `lint` already proves the workspace compiles; these jobs validate the binding
  # layers, a separate concern from the test result. Trade-off: they still run if
  # a test later fails, but on green runs the wall-clock saving is large.
  capi-check:
    name: C API Check
    needs: lint
    runs-on: ubuntu-latest

    env:
      OPENAI_URL: https://api.openai.com/v1
      OPENAI_TOKEN: ${{ secrets.OPENAI_KEY }}
      OPENAI_MODEL: gpt-4o-mini

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
        with:
          make-default: true
      - run: sudo apt-get update && sudo apt-get install -y cmake protobuf-compiler
      # The capi job runs three CMake builds (default, slim, panic) plus cargo
      # check × 2 on a runner that starts with ~25 GB free. Freeing the same set
      # of unused system packages as the other jobs gives back ~10 GB of headroom
      # and prevents the "Disk full?" linker crash seen when the runner fills up.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
          docker-images: true
      # Restore-only: the lint job saves the shared lbug C++ ccache. The capi
      # workspace resolves its own dep graph, but ccache keys on
      # compiler+flags+source content, so it hits the same entries.
      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false
      # This save was previously disabled outright. The reasoning was sound at
      # the time: the capi cache is the largest in the repo (~3 GB), saving it
      # kept the repo over the 10 GB quota, and the resulting LRU rotation left
      # lint/test/python cold. The cost of that workaround was accepting a
      # permanently cold ~37-min capi-check — which measurement showed is
      # CI's critical path (lint 344s → capi-check 2436s ≈ the whole 46-min run).
      #
      # It is re-enabled now that the quota pressure has been addressed at its
      # two real sources:
      #   1. every other writer above is main-only, so branches no longer mint
      #      duplicate copies on dependency-changing PRs;
      #   2. caches belonging to merged PRs are deleted rather than left to sit
      #      until their 7-day expiry — PR #127's caches alone were still
      #      holding 4.61 GB of a 10.35 GB quota hours after it merged.
      # Key bumped to v2: the tree no longer contains the check-slim target dir
      # (removed with the redundant cargo check passes) and now contains the
      # cargo test artifacts instead.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: capi-check-v2
          workspaces: |
            . -> target
            capi -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: capi/target/ort-cache
          key: ort-v2.0.0-rc.12-cpu-linux-x86_64
      # ORT_CACHE_DIR is read by ort-sys build script; point it at capi/target/
      # so the capi workspace build uses the same cached binary.
      - name: Run C API check (default + slim build + CMake examples)
        env:
          ORT_CACHE_DIR: ${{ github.workspace }}/capi/target/ort-cache
        run: bash capi/scripts/check.sh

  python-check:
    name: Python Bindings Check
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
        with:
          make-default: true
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # The release maturin build of the PyO3 extension compiles the whole
      # workspace (incl. lbug) and fills the runner's ~25 GB. Free the same
      # unused system packages as the other jobs (~10 GB headroom) to avoid the
      # "No space left on device" failure when building lbug's rlib.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
          docker-images: true
      # Restore-only: the lint job saves the shared lbug C++ ccache.
      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false
      # Restore-only share of workspace-test-v6: `maturin develop` (python/scripts/
      # check.sh) builds in DEBUG, so it reuses the test job's debug dep rlibs —
      # maturin then only compiles the PyO3 extension + workspace crates. A
      # dedicated key was tried (assuming a release build) but it just added a
      # ~3 GB cache that pushed the repo over GitHub's 10 GB quota and got evicted.
      # restore-only (save:false) so it benefits from the cache without writing a
      # divergent copy (the `test` job is the sole writer).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test-v6
          save-if: "false"
      - uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.12-cpu-linux-x86_64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only maturin: python/scripts/check.sh runs `maturin develop --extras
      # test`, which builds the extension and installs the test extra itself.
      # Pre-installing the project here with `pip install -e ".[test]"` would
      # both reintroduce the release-profile rebuild that command exists to
      # avoid, and mask any breakage in check.sh's own bootstrap — CI would
      # stay green against an environment this step had already prepared.
      # Bounded below at the same 1.5 python/pyproject.toml's dev extra
      # requires, and below 2 so a major release cannot change `develop` /
      # `--extras` behaviour under CI without a deliberate bump here.
      - name: Create venv and install maturin
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install 'maturin>=1.5,<2'
      - name: Run Python check
        run: |
          source .venv/bin/activate
          bash python/scripts/check.sh

  ts-check:
    name: JS/TS Bindings Check
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
        with:
          make-default: true
      # cmake is required by the `lbug` crate (pulled in via cognee's
      # `ladybug` feature), whose build.rs compiles bundled C++ with CMake.
      - run: sudo apt-get update && sudo apt-get install -y cmake protobuf-compiler
      # Restore-only: the lint job saves the shared lbug C++ ccache. The
      # bindings/ workspace resolves its own dep graph separately from the root
      # one, but ccache keys on compiler+flags+source content, so it hits the
      # same entries.
      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false
      # Dedicated key, NOT shared workspace-test-v6: the Neon module build
      # differs from the debug test cache, so sharing churned/polluted it. Its
      # own key caches the binding build across runs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-ts-v1
          workspaces: |
            . -> target
            bindings -> target
          cache-on-failure: true
          # main-only save — see the note in the lint job.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.12-cpu-linux-x86_64
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ts/package.json"
      - run: bash ts/scripts/check.sh

  java-check:
    name: Java Bindings Check
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
        with:
          make-default: true
      # cmake is required by the lbug crate (via cognee's ladybug feature).
      - run: sudo apt-get update && sudo apt-get install -y cmake protobuf-compiler
      - name: Set up JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: ccache (lbug bundled C++, restore-only)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lbug-cxx
          max-size: 1G
          save: false
      # Dedicated cache key for the bindings/ workspace (mirrors ts-check).
      # Same workspace, different key on purpose: ts-check builds it --release
      # and java-check builds it dev, so the two caches hold disjoint trees.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-java-v1
          workspaces: |
            . -> target
            bindings -> target
          cache-on-failure: true
          # main-only save — see the note in the lint job.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v4
        with:
          path: target/ort-cache
          key: ort-v2.0.0-rc.12-cpu-linux-x86_64
      - run: bash java/scripts/check.sh

  # ── Aggregate status (single required check for branch protection) ────
  # Gated to in-repo like the rest of the suite, so it does not run — and does
  # not report failure — on fork PRs (those are covered by the community
  # workflow's own aggregator). On in-repo refs every job above runs, so any
  # non-success here means the keyed suite failed. Mirrors the upstream Python
  # cognee `notify` aggregator.
  notify:
    name: Test Suite Status
    needs: [ lint, msrv, wasm, test, docs-and-extras, pgvector-postgres, pg-single-db-postgres, pggraph-postgres, capi-check, python-check, ts-check, java-check ]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check status
        run: |
          if [[ "${{ needs.lint.result }}" == "success" &&
                "${{ needs.msrv.result }}" == "success" &&
                "${{ needs.wasm.result }}" == "success" &&
                "${{ needs.test.result }}" == "success" &&
                "${{ needs.docs-and-extras.result }}" == "success" &&
                "${{ needs.pgvector-postgres.result }}" == "success" &&
                "${{ needs.pg-single-db-postgres.result }}" == "success" &&
                "${{ needs.pggraph-postgres.result }}" == "success" &&
                "${{ needs.capi-check.result }}" == "success" &&
                "${{ needs.python-check.result }}" == "success" &&
                "${{ needs.ts-check.result }}" == "success" &&
                "${{ needs.java-check.result }}" == "success" ]]; then
            echo "All keyed test-suite jobs passed!"
          else
            echo "One or more keyed test-suite jobs failed."
            exit 1
          fi
