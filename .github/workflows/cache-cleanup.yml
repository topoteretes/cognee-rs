name: Cache cleanup

# GitHub scopes a run's caches to the ref that produced them and keeps them
# until they go 7 days unread — merging a PR, deleting a branch or deleting a
# tag reclaims nothing. On a repo whose Rust caches run ~1 GB each that is a
# large, standing tax on the 10 GB quota: hours after #127 merged, its
# refs/pull/127/merge entries still held 4.61 GB of a 10.35 GB quota, and the
# resulting LRU eviction is what kept the working caches cold.
#
# Three ref shapes accumulate here, and all three are handled below:
#   refs/pull/<n>/merge  — PR runs (ci.yml, community.yml, http-parity.yml, …)
#   refs/heads/<branch>  — workflow_dispatch runs and pushes to non-PR branches
#   refs/tags/<tag>      — capi-release.yml, ts-prebuild.yml, java-prebuild.yml
#                          all run on `push: tags:` with unrestricted
#                          rust-cache across a platform matrix
#
# How safe is deleting? It differs per shape, and it is worth being exact:
#   - refs/pull/<n>/merge is genuinely unreachable once the PR closes.
#   - refs/heads/<branch> CAN come back — GitHub's "Restore branch" button, or
#     the same name re-pushed. So can a still-open stacked PR whose base was
#     the deleted branch. In those cases the cost is a cold rebuild, not lost
#     data: the next run repopulates from main. That is the tradeoff being
#     made deliberately, since a branch that stays deleted is the common case.
#   - refs/tags/<tag> comes back if a release tag is re-pushed, with the same
#     cold-rebuild cost.
#
# This is the other half of the main-only `save-if` policy in ci.yml — that
# stops branches *writing* duplicates, this reclaims what runs already wrote.

on:
  # pull_request_target, NOT pull_request. A `pull_request` run for a PR from a
  # fork gets a read-only GITHUB_TOKEN no matter what the permissions block
  # says, so the delete below would silently fail for exactly the PRs that most
  # need it — community.yml (the fork lane) saves workspace-lint-v6 and
  # workspace-test-v6 unrestricted, so a fork PR writes ~2 GB of its own.
  #
  # The usual pull_request_target hazard is running untrusted head code with a
  # writable token. That does not apply here: this workflow has no checkout and
  # executes nothing from the PR — it reads only the PR *number* from the event
  # and calls the cache API.
  pull_request_target:
    types: [ closed ]
  # Branch and tag deletion, which the PR path does not cover. During this
  # repo's CI work these had to be deleted by hand twice, including a 0.92 GB
  # release tree. Not fork-triggerable: deleting a ref requires push access.
  delete:
  # Manual escape hatch. The `delete` event fires exactly once per ref and
  # cannot be replayed, so anything it misses would otherwise be unreachable:
  # a run whose post-job cache save lands seconds AFTER the cleanup listed the
  # ref, a ref deleted by an action using GITHUB_TOKEN (which GitHub does not
  # turn into a workflow run), or a ref deleted before this workflow existed.
  # Hence `ref` accepts any shape, not just a PR number.
  workflow_dispatch:
    inputs:
      ref:
        description: "Full ref to reclaim, e.g. refs/heads/my-branch or refs/tags/v0.2.0"
        required: false
        type: string
      pr_number:
        description: "PR number to reclaim (shorthand for refs/pull/<n>/merge)"
        required: false
        type: string

permissions:
  # actions: write is what the cache delete API requires. contents: read has to
  # be restated because naming any permission resets the rest to none.
  actions: write
  contents: read

concurrency:
  # Per-ref, deliberately NOT a single shared group. A shared group would look
  # like the way to serialise a batch of branch deletions, but GitHub keeps only
  # one running plus one pending run per group and CANCELS the rest — so
  # deleting ten branches would silently skip most of the cleanups. Per-ref runs
  # all survive; the API pressure that creates is handled by the retry/backoff
  # around the DELETE below instead.
  group: cache-cleanup-${{ github.event.pull_request.number || inputs.ref || inputs.pr_number || github.event.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Reclaim caches for a closed PR, deleted branch or tag
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches scoped to the ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          INPUT_REF: ${{ inputs.ref }}
          DELETED_REF: ${{ github.event.ref }}
          DELETED_REF_TYPE: ${{ github.event.ref_type }}
          # A secondary rate limit is transient; give it a few chances before
          # calling the run red.
          DELETE_RETRIES: "4"
          DELETE_BACKOFF: "5"
        run: |
          set -euo pipefail

          # ── Which ref are we reclaiming? ───────────────────────────────────
          case "${EVENT}" in
            delete)
              # `github.event.ref` on a delete event is the UNQUALIFIED short
              # name ("my-branch", "v0.2.0"), so it needs the refs/ prefix.
              case "${DELETED_REF_TYPE}" in
                branch) REF="refs/heads/${DELETED_REF}"; LABEL="deleted branch ${DELETED_REF}" ;;
                tag)    REF="refs/tags/${DELETED_REF}";  LABEL="deleted tag ${DELETED_REF}" ;;
                *)
                  echo "error: unexpected ref_type '${DELETED_REF_TYPE}' for ${DELETED_REF}" >&2
                  exit 1
                  ;;
              esac
              ;;
            pull_request_target)
              REF="refs/pull/${PR}/merge"; LABEL="PR #${PR}"
              ;;
            workflow_dispatch)
              if [ -n "${INPUT_REF}" ]; then
                # Must be a real ref shape. The API filter is exact-match, so a
                # malformed value would silently match nothing and report a
                # green "nothing to do" — the fail-silent mode this file exists
                # to avoid.
                case "${INPUT_REF}" in
                  refs/heads/*|refs/tags/*|refs/pull/*) ;;
                  *)
                    echo "error: ref must start with refs/heads/, refs/tags/ or refs/pull/, got '${INPUT_REF}'" >&2
                    exit 1
                    ;;
                esac
                REF="${INPUT_REF}"; LABEL="ref ${INPUT_REF}"
              elif [ -n "${PR}" ]; then
                # Digits-only. This used to be interpolated straight into a jq
                # `select(.ref == "…")` predicate, where `x" or true or .ref=="`
                # would have matched every cache in the repo and deleted main's
                # warm caches wholesale.
                if ! [[ "${PR}" =~ ^[0-9]+$ ]]; then
                  echo "error: pr_number must be digits only, got '${PR}'" >&2
                  exit 1
                fi
                REF="refs/pull/${PR}/merge"; LABEL="PR #${PR}"
              else
                echo "error: provide either 'ref' or 'pr_number'" >&2
                exit 1
              fi
              ;;
            *)
              echo "error: unsupported event '${EVENT}'" >&2
              exit 1
              ;;
          esac
          echo "Reclaiming caches for ${REF}"

          # ── List: server-side ref filter, paginated ────────────────────────
          # `GET /actions/caches` lists every cache in the repo, so filtering
          # client-side over a single 100-item page could miss this ref's
          # entries entirely — the endpoint sorts by last_accessed_at desc, so
          # the least recently used page out first. Passing the ref via `-f`
          # also means gh URL-encodes it and nothing is interpolated into a jq
          # program.
          #
          # Written to a file with the status checked, NOT read from a process
          # substitution: bash does not check a process substitution's status
          # and `pipefail` does not cover `< <(…)`, so a 403, a rate limit, a
          # 5xx or a jq error produced zero lines and was reported as "nothing
          # to do" on a green run.
          CACHES="$(mktemp)"
          if ! gh api --paginate -X GET "repos/${GH_REPO}/actions/caches" \
                -f per_page=100 -f ref="${REF}" \
                --jq '.actions_caches[] | [.id, .size_in_bytes, .key] | @tsv' \
                > "${CACHES}"; then
            echo "error: failed to list caches for ${REF} (see the API error above)" >&2
            exit 1
          fi

          # ── Delete, retrying the transient failures ────────────────────────
          # 0 = deleted, 1 = already gone (404), 2 = real failure.
          # DELETE_ERR carries the last error text.
          delete_cache() {
            local id="$1" attempt=1
            while :; do
              if DELETE_ERR="$(gh api -X DELETE "repos/${GH_REPO}/actions/caches/${id}" --silent 2>&1)"; then
                return 0
              fi
              printf '%s' "${DELETE_ERR}" | grep -q '404' && return 1
              # Concurrent cleanup runs (a batch of branch deletions) can trip
              # the secondary rate limit on the same endpoint. Back off rather
              # than turning routine housekeeping red.
              if [ "${attempt}" -lt "${DELETE_RETRIES}" ] \
                 && printf '%s' "${DELETE_ERR}" | grep -qiE '403|429|rate limit|abuse|secondary'; then
                echo "  retrying ${id} after transient error (attempt ${attempt})"
                sleep $((attempt * DELETE_BACKOFF))
                attempt=$((attempt + 1))
                continue
              fi
              return 2
            done
          }

          FREED=0
          COUNT=0
          FAILED=0
          while IFS=$'\t' read -r id size key; do
            [ -n "${id:-}" ] || continue
            COUNT=$((COUNT + 1))
            size="${size:-0}"
            rc=0
            delete_cache "${id}" || rc=$?
            case "${rc}" in
              0) echo "  deleted ${key} ($((size / 1024 / 1024)) MiB)"; FREED=$((FREED + size)) ;;
              1) echo "  gone already ${key} (404 — concurrent eviction)" ;;
              *) echo "  FAILED ${key}: ${DELETE_ERR}" >&2; FAILED=$((FAILED + 1)) ;;
            esac
          done < "${CACHES}"
          rm -f "${CACHES}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "No caches found for ${REF} — nothing to do."
            exit 0
          fi

          echo "Reclaimed $((FREED / 1024 / 1024)) MiB for ${REF}"
          {
            echo "### Cache cleanup for ${LABEL}"
            echo "Reclaimed **$((FREED / 1024 / 1024)) MiB** across ${COUNT} cache entries."
            if [ "${FAILED}" -gt 0 ]; then
              echo ""
              echo ":warning: **${FAILED}** delete(s) failed after ${DELETE_RETRIES} attempts — see the job log."
              echo "Re-run this workflow manually with \`ref: ${REF}\` to retry."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${FAILED}" -gt 0 ]; then
            echo "error: ${FAILED} cache delete(s) failed for ${REF}" >&2
            echo "       retry with: gh workflow run cache-cleanup.yml -f ref=${REF}" >&2
            exit 1
          fi
