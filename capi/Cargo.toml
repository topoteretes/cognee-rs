# capi/Cargo.toml — standalone workspace for the C API bindings.
#
# Extracted from the root workspace per decision D10 (phase 0). The capi
# workspace carries no `[patch.crates-io]` block — the qdrant fork chain
# lives in the closed cognee-cloud-rs workspace alongside the qdrant
# adapter — so no cross-workspace patch sync is required for OSS builds.
[workspace]
members = ["cognee-capi"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.0"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
authors = ["Topoteretes <support@cognee.ai>"]
description = "C API bindings for the cognee Rust SDK — AI memory pipeline (add → cognify → search)."
repository = "https://github.com/topoteretes/cognee-rs"
homepage = "https://www.cognee.ai"
readme = "README.md"
keywords = ["ai", "knowledge-graph", "memory", "rag", "embeddings"]
categories = ["science", "database", "text-processing"]

[workspace.dependencies]
# Keep these versions in sync with the root workspace [workspace.dependencies].
async-trait = "0.1.89"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.21", features = ["v4", "v5", "serde"] }

# Panic-across-FFI safety: abort on panic so an unwinding panic can never
# cross the `extern "C"` boundary. This is the primary safety floor for the
# C API; `catch_unwind` in spawn_sdk_op provides graceful degradation on top.
[profile.dev]
panic = "abort"

# Same graded debug-info split as the release profile below, and for a bigger
# payoff: capi/CMakeLists.txt runs a bare `cargo build` (no --release) and
# imports `${CARGO_TARGET_DIR}/debug/libcognee_capi.a`, so the Rust half of
# every CMake build — and therefore every `scripts/check_all.sh` run — uses
# this profile whatever -DCMAKE_BUILD_TYPE is set to. The release profile is
# reached only by an explicit `cargo build --release`.
#
# Untuned, that cost 36.5 GiB per check_all.sh run. Measured from clean on
# aarch64-apple-darwin:
#
#                            capi/target   capi/build   lbug C++   per example
#   panic=abort only            27 GiB       9.5 GiB     2.9 GiB      510 MiB
#   this config                 10 GiB       4.9 GiB     208 MiB      264 MiB
#
# capi/build is the CMake tree: 19 example binaries, each statically linking
# libcognee_capi.a, so the archive's debug info is paid for 19 times over.
#
# `opt-level = 1` on dependencies is not a speed setting. The `cmake` crate
# derives CMAKE_BUILD_TYPE from the OPT_LEVEL/DEBUG cargo exports to a build
# script (cmake 0.1.58: opt-level 0 -> Debug; opt-level >= 1 with debug=false
# -> Release; opt-level >= 1 with debug -> RelWithDebInfo), so this pairing is
# what flips lbug's bundled Ladybug tree to a Release C++ build — the
# 2.9 GiB -> 208 MiB row. See docs/build/lbug-rebuilds.md.
#
# Deliberate trade-off: Release and RelWithDebInfo both define NDEBUG, and lbug
# gates its internal KU_ASSERT/RUNTIME_CHECK on
# `defined(LBUG_RUNTIME_CHECKS) || !defined(NDEBUG)` (lbug-src assert.h), so
# those checks are compiled out here — this profile was the last one in which
# they still fired. To get them back without giving up the small tree,
# configure with -DCOGNEE_CAPI_LBUG_ASSERTS=ON (see capi/CMakeLists.txt): that
# defines LBUG_RUNTIME_CHECKS, satisfying the first half of the condition
# independently of NDEBUG.
#
# panic = "abort" is untouched: it is the FFI safety floor, and neither
# opt-level nor debug interacts with it.
[profile.dev.package."*"]
debug = 0
opt-level = 1

# First-party crates: full debug info AND an explicit opt-level 0 — both are
# needed. Named package overrides *merge onto* the "*" glob rather than
# replacing it, so `debug = true` alone would leave these at the glob's
# opt-level 1, giving optimized-out locals and reordered lines when stepping
# through cognee frames in a C example, plus optimization paid on every
# incremental edit. These crates are path *dependencies* of cognee-capi rather
# than members of this workspace, so the glob does catch them (unlike the root
# workspace, whose members are exempt by definition).
#
# Hand-maintained, like the release list, because cargo has no prefix glob for
# package overrides. A crate added to crates/ and pulled into this closure
# silently falls under the glob instead — debug = 0, so no line tables at all —
# and cargo warns only for specs matching *no* package, never for one matching
# only the glob. Re-check this list when adding a crate to crates/.
[profile.dev.package.cognee]
debug = true
opt-level = 0
[profile.dev.package.cognee-bindings-common]
debug = true
opt-level = 0
[profile.dev.package.cognee-chunking]
debug = true
opt-level = 0
[profile.dev.package.cognee-cognify]
debug = true
opt-level = 0
[profile.dev.package.cognee-components]
debug = true
opt-level = 0
[profile.dev.package.cognee-core]
debug = true
opt-level = 0
[profile.dev.package.cognee-database]
debug = true
opt-level = 0
[profile.dev.package.cognee-delete]
debug = true
opt-level = 0
[profile.dev.package.cognee-embedding]
debug = true
opt-level = 0
[profile.dev.package.cognee-graph]
debug = true
opt-level = 0
[profile.dev.package.cognee-ingestion]
debug = true
opt-level = 0
[profile.dev.package.cognee-llm]
debug = true
opt-level = 0
[profile.dev.package.cognee-logging]
debug = true
opt-level = 0
[profile.dev.package.cognee-models]
debug = true
opt-level = 0
[profile.dev.package.cognee-observability]
debug = true
opt-level = 0
[profile.dev.package.cognee-ontology]
debug = true
opt-level = 0
[profile.dev.package.cognee-search]
debug = true
opt-level = 0
[profile.dev.package.cognee-session]
debug = true
opt-level = 0
[profile.dev.package.cognee-storage]
debug = true
opt-level = 0
[profile.dev.package.cognee-telemetry]
debug = true
opt-level = 0
[profile.dev.package.cognee-truth-subspace]
debug = true
opt-level = 0
[profile.dev.package.cognee-utils]
debug = true
opt-level = 0
[profile.dev.package.cognee-vector]
debug = true
opt-level = 0
[profile.dev.package.cognee-visualization]
debug = true
opt-level = 0

[profile.release]
# Full debug info for first-party code (see the per-package overrides below),
# plus panic=abort.
debug = true
panic = "abort"

# Graded debug info: full DWARF for first-party code, line tables for
# third-party Rust, none for the vendored C++. `debug = true` above applies to
# cognee-capi itself; every cognee-* crate is re-enabled individually below.
# Measured on aarch64-apple-darwin, from clean:
#
#                                          capi/target   libcognee_capi.a
#   debug = true everywhere                  21.7 GiB         4.65 GiB
#   deps debug = 0                            4.7 GiB         0.78 GiB
#   deps line-tables-only (lbug included)    16.2 GiB         3.12 GiB
#   this config                              10.5 GiB         2.02 GiB
#
# The `.a` column is what matters most: it is the input to each xcframework
# slice. This takes CogneeSDK.xcframework from ~6.6 GB to ~2.9 GB (estimated:
# the two iOS slices were not built, the host slice was measured) while every
# Rust frame in an iOS crash report — ours and our dependencies' — resolves to
# file and line rather than a bare function name. All 139 exported cg_sdk_*
# symbols are unaffected.
#
# The lbug override below is what makes line tables affordable. Cargo hands a
# build script DEBUG=true for ANY non-zero debug level, and the `cmake` crate
# maps that to RelWithDebInfo, so line-tables-only alone re-inflates the
# bundled Ladybug C++ tree 213 MiB -> 2.6 GiB (the third row above). Pinning
# just lbug back to 0 keeps that tree a plain Release build and costs only the
# line tables of lbug's own thin Rust binding layer, which is generated
# FFI glue nobody steps through. See docs/build/lbug-rebuilds.md.
#
# Cargo has no prefix glob for package overrides, so first-party crates are
# listed one by one. The list is the path-dependency closure of cognee-capi;
# a crate missing from it silently drops to line tables rather than breaking
# the build, so re-check it when adding a crate to crates/.
[profile.release.package."*"]
debug = "line-tables-only"

# Not line tables: this crate's build script compiles the bundled Ladybug C++
# tree, and any non-zero debug level costs 2.4 GiB there. See above.
[profile.release.package.lbug]
debug = 0

[profile.release.package.cognee]
debug = true
[profile.release.package.cognee-bindings-common]
debug = true
[profile.release.package.cognee-chunking]
debug = true
[profile.release.package.cognee-cognify]
debug = true
[profile.release.package.cognee-components]
debug = true
[profile.release.package.cognee-core]
debug = true
[profile.release.package.cognee-database]
debug = true
[profile.release.package.cognee-delete]
debug = true
[profile.release.package.cognee-embedding]
debug = true
[profile.release.package.cognee-graph]
debug = true
[profile.release.package.cognee-ingestion]
debug = true
[profile.release.package.cognee-llm]
debug = true
[profile.release.package.cognee-logging]
debug = true
