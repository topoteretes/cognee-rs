[package]
name = "cognee-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Session/conversation store (filesystem, Redis, SeaORM) for the cognee pipeline."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# Opt-in. `cognee`'s `session-redis` feature (via `cognee-components/session-redis`)
# enables it and registers the store; nothing in the workspace turns that on.
redis = ["dep:redis"]
fs = []
# Session entries in the relational database, through `cognee_database::SessionQaDb`.
relational-store = ["dep:cognee-database"]
# Former name of `relational-store`.
sea-orm-store = ["relational-store"]
telemetry = ["cognee-telemetry/telemetry"]

[dependencies]
cognee-llm = { path = "../llm", version = "0.2.0" }
cognee-telemetry = { path = "../telemetry", version = "0.2.0" }
async-trait.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
regex.workspace = true
schemars.workspace = true

# relational backend (feature-gated)
cognee-database = { path = "../database", version = "0.2.0", optional = true }

# redis backend (feature-gated)
redis = { version = "0.29", features = ["aio", "tokio-comp", "connection-manager"], optional = true }

# Integration tests whose whole file is behind a `#![cfg(feature = ...)]`.
# Without a `required-features` entry cargo still builds the target in a lane
# that does not enable the feature, and it compiles to a green `running 0
# tests` that is indistinguishable from a lane that really ran them. Declaring
# the requirement makes cargo omit the target instead, and naming it explicitly
# then fails with the feature to pass rather than reporting a green zero.
# Every other test target here is still auto-discovered; listing these does not
# opt out of that (`autotests` stays at its edition-2018+ default of `true`).

[[test]]
name = "fs_store_tests"
path = "tests/fs_store_tests.rs"
required-features = ["fs"]

[[test]]
name = "relational_store_tests"
path = "tests/relational_store_tests.rs"
required-features = ["relational-store"]

[[test]]
name = "agent_context_extraction"
path = "tests/agent_context_extraction.rs"
required-features = ["fs"]

[[test]]
name = "test_session_manager_trace"
path = "tests/test_session_manager_trace.rs"
required-features = ["fs"]

[dev-dependencies]
cognee-database = { path = "../database", features = ["sqlite"] }
tokio.workspace = true
tempfile.workspace = true
