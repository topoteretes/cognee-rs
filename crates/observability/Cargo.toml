[package]
name = "cognee-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenTelemetry tracing and metrics integration for the cognee pipeline."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []

telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "dep:tonic",
    "dep:http",
]

[dependencies]
cognee-utils = { path = "../utils", version = "0.2.0" }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
# Required for building gRPC `MetadataMap` headers when the `telemetry`
# feature is enabled. Pinned to the version `opentelemetry-otlp 0.31`
# uses transitively, so a single tonic 0.14 graph is reused.
tonic = { version = "=0.14", default-features = false, optional = true }
http = { version = "1", optional = true }

# Integration tests whose whole file is behind a `#![cfg(feature = ...)]`.
# Without a `required-features` entry cargo still builds the target in a lane
# that does not enable the feature, and it compiles to a green `running 0
# tests` that is indistinguishable from a lane that really ran them. Declaring
# the requirement makes cargo omit the target instead, and naming it explicitly
# then fails with the feature to pass rather than reporting a green zero.
# Every other test target here is still auto-discovered; listing these does not
# opt out of that (`autotests` stays at its edition-2018+ default of `true`).

[[test]]
name = "init"
path = "tests/init.rs"
required-features = ["telemetry"]

[[test]]
name = "otel_export"
path = "tests/otel_export.rs"
required-features = ["telemetry"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
opentelemetry-proto = { version = "=0.31", default-features = false, features = ["gen-tonic", "trace"] }
tonic = { version = "=0.14", default-features = false, features = ["server", "transport", "router"] }
serial_test = { workspace = true }
