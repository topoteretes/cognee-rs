[package]
name = "cognee-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LLM client abstraction (OpenAI-compatible) for the cognee AI-memory pipeline."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# Record/replay cassette-based mock LLM support.
mock = ["dep:sha2"]
# AWS Bedrock provider: shared AWS plumbing (`adapters::bedrock::aws`) plus the
# Bedrock adapter built on it. Non-default because the AWS stack is not free —
# see docs/roadmap/bedrock-provider-plan.md §2.3 and §3.
bedrock = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sigv4",
    "dep:aws-smithy-runtime-api",
    # Not imported by this crate — declared only to hold the MSRV pin on three
    # transitive smithy crates. See the workspace manifest. Add to this list
    # whenever a new transitive smithy crate needs pinning; a pin in
    # [workspace.dependencies] is inert until some crate references it.
    "dep:aws-smithy-async",
    "dep:aws-smithy-types",
    "dep:aws-smithy-runtime-api-macros",
]

[dependencies]
# Async runtime
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
# serde_json's `preserve_order` is LOAD-BEARING here, and comes from the
# workspace root (see the note there). `generate_json_schema` ends with
# `serde_json::to_value(schema)`, so without it the schema's properties are
# re-sorted ALPHABETICALLY on the wire — which measured a 19% LLM runaway rate
# against 0% for declaration order (Fisher p=0.0002).
serde_json.workspace = true

# JSON Schema generation
schemars.workspace = true

# Base64 encoding (for vision API image data URIs)
base64.workspace = true

# Error handling
thiserror.workspace = true

# HTTP client (for API-based implementations)
reqwest = { workspace = true, features = ["multipart"] }

# Jitter for retry backoff
rand = { workspace = true }

tracing.workspace = true

# Shared tracing-key constants
cognee-utils = { path = "../utils", version = "0.2.0" }

# Content hashing (cassette mock, feature-gated)
sha2 = { workspace = true, optional = true }

# AWS Bedrock stack (feature-gated). Versions are pinned in the workspace
# manifest against the 1.91.1 MSRV — see the comment there before bumping.
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
aws-smithy-async = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }
aws-smithy-runtime-api-macros = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
cognee-test-utils = { path = "../test-utils" }
dotenv.workspace = true
httpmock = "0.8"
# The bedrock tests drive the signer and the transport seam directly, which is
# the same reqwest surface the adapter (R3) will use.
reqwest = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

# Every `bedrock_*.rs` integration test is a whole file behind
# `#![cfg(feature = "bedrock")]`, and `bedrock` is not a default feature. Without
# a `required-features` entry cargo still BUILDS each of these targets in a lane
# that forgot `--features bedrock` — the file compiles to nothing, the harness
# prints `running 0 tests`, and the lane exits green having verified nothing.
# That is issue #212, and it has already cost this repo a lane
# (`pgvector-spans`) that reported green for its whole life. With these entries
# such a lane skips the target explicitly instead.
#
# Autodiscovery still covers every other test file: declaring explicit `[[test]]`
# targets does not disable it, and a name declared here simply wins over the
# auto-discovered one.
[[test]]
name = "bedrock_converse_transform"
required-features = ["bedrock"]

[[test]]
name = "bedrock_credentials_ladder"
required-features = ["bedrock"]

[[test]]
name = "bedrock_integration"
required-features = ["bedrock"]

[[test]]
name = "bedrock_model_id_normalisation"
required-features = ["bedrock"]

[[test]]
name = "bedrock_pacing"
required-features = ["bedrock"]

[[test]]
name = "bedrock_region_endpoint"
required-features = ["bedrock"]

[[test]]
name = "bedrock_request_deadline"
required-features = ["bedrock"]

[[test]]
name = "bedrock_retry_floor_excludes_queue_time"
required-features = ["bedrock"]

[[test]]
name = "bedrock_sigv4_golden"
required-features = ["bedrock"]

[[test]]
name = "bedrock_structured_output"
required-features = ["bedrock"]

[[test]]
name = "bedrock_truncation_retry"
required-features = ["bedrock"]
