[package]
name = "cognee-vector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vector-store abstraction for cognee: brute-force, plus LanceDB (feature `lancedb`) and pgvector (feature `pgvector`) adapters."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# LanceDB pulls the Arrow + lance native stack, one of the largest builds in the
# workspace. Consumers whose vector backend is something else (pgvector, a closed
# adapter, brute-force) can now leave it out. Off at this level; `cognee`,
# `cognee-http-server` and every binding enable it in their own defaults, so a
# plain build of those is unchanged.
lancedb  = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:futures"]
pgvector = ["dep:sea-orm", "dep:sea-orm-migration"]
testing  = []

[dependencies]
# Async
tokio       = { workspace = true }
async-trait = { workspace = true }

# PGVector / SeaORM (feature-gated)
sea-orm = { version = "1.1", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-uuid",
    "with-json",
], optional = true }
sea-orm-migration = { version = "1.1", features = [
    "runtime-tokio-rustls",
], optional = true }

# Data structures
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
tracing = { workspace = true }

# Telemetry constants
cognee-utils = { path = "../utils", version = "0.2.0" }

# Integration tests whose whole file is behind a `#![cfg(feature = ...)]`.
# Without a `required-features` entry cargo still builds the target in a lane
# that does not enable the feature, and it compiles to a green `running 0
# tests` that is indistinguishable from a lane that really ran them. Declaring
# the requirement makes cargo omit the target instead, and naming it explicitly
# then fails with the feature to pass rather than reporting a green zero.
# Every other test target here is still auto-discovered; listing these does not
# opt out of that (`autotests` stays at its edition-2018+ default of `true`).

[[test]]
name = "pgvector_close"
path = "tests/pgvector_close.rs"
required-features = ["pgvector"]

[[test]]
name = "pgvector_integration"
path = "tests/pgvector_integration.rs"
required-features = ["pgvector"]

[[test]]
name = "pgvector_span_instrumentation"
path = "tests/pgvector_span_instrumentation.rs"
required-features = ["pgvector"]

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true
cognee-test-utils = { path = "../test-utils" }
# `create_temp_postgres_db` (used by the inline `shared_db_migration_tests` cases
# for their per-test databases) opens its maintenance connection through
# `cognee_database::connect`, which needs an sqlx driver at *runtime* — sea-orm
# returns "URL scheme not supported" without one. `cognee-database` declares no
# default features, and `cognee-test-utils` pulls it in bare, so the driver would
# otherwise arrive only by feature unification with this crate's own `pgvector`
# feature (which enables `sea-orm/sqlx-postgres`). That happens to hold today (one
# shared sea-orm 1.1), but it is invisible and would break the moment the two
# crates resolve to different sea-orm versions, with a runtime error rather than a
# compile one. Spell it out instead — same reasoning, same helper, as
# `crates/graph/Cargo.toml`.
cognee-database = { path = "../database", features = ["postgres"] }
cognee-models = { path = "../models" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# LanceDB adapter (durable embedded vector store) — behind the `lancedb` feature,
# and only on targets where the Arrow / lance native stack builds cleanly. Android
# cross-compiles fall back to BruteForceVectorDB; see lancedb_adapter.rs.
[target.'cfg(not(target_os = "android"))'.dependencies]
lancedb      = { version = "=0.29", optional = true }
arrow-array  = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }
futures      = { version = "0.3", optional = true }
