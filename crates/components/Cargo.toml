[package]
name = "cognee-components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cognee — shared pipeline-component construction: adapter factories + a pluggable registry."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Standalone builds register the common OSS provider set. Downstream crates
# (cognee, cognee-http-server) depend with `default-features = false` and
# forward exactly the features they want, so `--no-default-features` builds
# stay precise.
default = ["onnx", "ladybug", "lancedb", "pgvector", "pggraph", "mock-llm", "bedrock", "sqlite", "postgres"]

onnx         = ["cognee-embedding/onnx"]
onnx-dynamic = ["onnx", "cognee-embedding/onnx-dynamic"]
ort-cuda     = ["cognee-embedding/ort-cuda"]
ort-tensorrt = ["cognee-embedding/ort-tensorrt"]
ladybug      = ["cognee-graph/ladybug"]
# Embedded LanceDB vector store. Gated because the Arrow + lance native stack is
# one of the largest builds in the workspace and a consumer on pgvector (or an
# external adapter) does not need it; `with_builtins()` registers the `lancedb`
# provider only when this is on.
lancedb      = ["cognee-vector/lancedb"]
pgvector     = ["cognee-vector/pgvector", "dep:url"]
# Relational drivers: `with_builtins()` registers the SeaORM relational factory
# under `sqlite` / `postgres` only when the matching driver is compiled in.
sqlite       = ["cognee-database/sqlite"]
postgres     = ["cognee-database/postgres"]
# Session stores beyond the relational one: `with_builtins()` registers the
# `fs` / `redis` session-store factories (and their config sections) only when
# these are on.
session-fs    = ["cognee-session/fs"]
session-redis = ["cognee-session/redis"]
pggraph      = ["cognee-graph/postgres", "dep:url"]
# Record/replay cassette-based mock LLM (MOCK_LLM / COGNEE_RECORD_LLM).
mock-llm     = ["cognee-llm/mock"]
# AWS Bedrock provider. Default-on (plan §2.3, §6.2): it registers the
# `bedrock` LLM factory in `with_builtins()` (`builtins::llm::BedrockLlmFactory`,
# the Converse adapter) *and* the embedding side — the `aws` carry-across in
# `builtins::embedding::build_embedding_config` plus `cognee-embedding`'s
# Bedrock engine. Drop it with `--no-default-features` the same way `lancedb` is
# dropped; `LLM_PROVIDER=bedrock` then reports an unsupported provider.
bedrock      = ["cognee-embedding/bedrock", "cognee-llm/bedrock"]
# Enables the in-memory `mock` vector and graph providers in `with_builtins()`.
testing      = ["cognee-vector/testing", "cognee-graph/testing"]

[dependencies]
# Component-owned config sections: factories declare them, the registry
# collects them into a ConfigSchema.
cognee-config-core = { path = "../config-core", version = "0.2.0" }
cognee-cognify = { path = "../cognify", version = "0.2.0" }
cognee-database = { path = "../database", version = "0.2.0" }
cognee-ontology = { path = "../ontology", version = "0.2.0" }
cognee-embedding = { path = "../embedding", version = "0.2.0" }
cognee-graph = { path = "../graph", version = "0.2.0" }
cognee-llm = { path = "../llm", version = "0.2.0" }
cognee-storage = { path = "../storage", version = "0.2.0" }
cognee-session = { path = "../session", version = "0.2.0", features = ["relational-store"] }
# Dispatch pacing primitives shared with the LLM/embedding adapters.
cognee-utils = { path = "../utils", version = "0.2.0" }
cognee-vector = { path = "../vector", version = "0.2.0" }
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Per-dataset storage: the bind cells (`OnceCell`) and the embedded handlers'
# file removal.
tokio = { workspace = true }
url = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
cognee-models = { path = "../models" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
cognee-vector = { path = "../vector", features = ["testing"] }
cognee-database = { path = "../database", features = ["sqlite"] }
