[package]
name = "cognee-database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Relational metadata store (SQLite/Postgres via SeaORM) for the cognee AI-memory pipeline."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
sqlite   = ["sea-orm/sqlx-sqlite", "dep:log", "dep:tokio"]
postgres = ["sea-orm/sqlx-postgres"]

[dependencies]
cognee-models     = { path = "../models", version = "0.2.0" }
cognee-utils      = { path = "../utils", version = "0.2.0" }
async-trait.workspace = true
chrono.workspace  = true
include_dir = "0.7"
# `log::LevelFilter` for sqlx statement-log levels; only the sqlite path needs it.
log = { workspace = true, optional = true }
sea-orm = { version = "1.1", features = [
    "runtime-tokio-rustls",
    "with-chrono",
    "with-uuid",
    "with-json",
] }
sea-orm-migration = { version = "1.1", features = ["runtime-tokio-rustls"] }
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
serde.workspace = true
# serde_json's `preserve_order` (workspace root) keeps `serde_json::Map`
# insertion-ordered so entity
# `to_dict()` helpers (e.g. `session_record::Model::to_dict`) can match
# the field ordering of Python's `to_dict()` byte-for-byte.
serde_json.workspace = true
# Only the sqlite connect path uses `spawn_blocking` (for the WAL writability
# probe); gated behind the `sqlite` feature so non-sqlite builds don't link it.
tokio = { workspace = true, optional = true }

# Integration tests whose whole file is behind a `#![cfg(feature = ...)]`.
# Without a `required-features` entry cargo still builds the target in a lane
# that does not enable the feature, and it compiles to a green `running 0
# tests` that is indistinguishable from a lane that really ran them. Declaring
# the requirement makes cargo omit the target instead, and naming it explicitly
# then fails with the feature to pass rather than reporting a green zero.
# Every other test target here is still auto-discovered; listing these does not
# opt out of that (`autotests` stays at its edition-2018+ default of `true`).

[[test]]
name = "audit_query_consolidation"
path = "tests/audit_query_consolidation.rs"
required-features = ["sqlite"]

[[test]]
name = "connection_pool"
path = "tests/connection_pool.rs"
required-features = ["sqlite"]

[[test]]
name = "data_update_last_accessed"
path = "tests/data_update_last_accessed.rs"
required-features = ["sqlite"]

[[test]]
name = "pipeline_status_key_compat"
path = "tests/pipeline_status_key_compat.rs"
required-features = ["sqlite"]

[[test]]
name = "provenance_run_scope"
path = "tests/provenance_run_scope.rs"
required-features = ["sqlite"]

[[test]]
name = "provenance_transaction"
path = "tests/provenance_transaction.rs"
required-features = ["sqlite"]

[[test]]
name = "relational_ops_span_instrumentation"
path = "tests/relational_ops_span_instrumentation.rs"
required-features = ["sqlite"]

[dev-dependencies]
cognee-test-utils = { path = "../test-utils" }
serial_test.workspace = true
tokio.workspace = true
tempfile = "3"
