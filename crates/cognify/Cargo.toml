[package]
name = "cognee-cognify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Knowledge-graph extraction (cognify) — turn ingested data into a graph for cognee."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Forwarded so a deployment can compile a real BPE token counter. Without it
# `TokenCounterKind::TikToken` degrades to whitespace counting at runtime and a
# token budget gets spent in words — see cognee-chunking::TokenCounterKind::effective.
tiktoken = ["cognee-chunking/tiktoken"]
testing = ["cognee-storage/testing", "cognee-graph/testing", "cognee-vector/testing"]
html-loader = ["cognee-ingestion/html-loader"]
image-loader = ["cognee-ingestion/image-loader"]
audio-loader = ["cognee-ingestion/audio-loader"]

[dependencies]
cognee-models = { path = "../models", version = "0.2.0" }
cognee-storage = { path = "../storage", version = "0.2.0" }
cognee-chunking = { path = "../chunking", version = "0.2.0" }
cognee-core = { path = "../core", version = "0.2.0" }
cognee-ingestion = { path = "../ingestion", version = "0.2.0" }
cognee-llm = { path = "../llm", version = "0.2.0" }
cognee-graph = { path = "../graph", version = "0.2.0" }
cognee-utils = { path = "../utils", version = "0.2.0" }
cognee-embedding = { path = "../embedding", version = "0.2.0" }
cognee-vector = { path = "../vector", version = "0.2.0" }
cognee-ontology = { path = "../ontology", version = "0.2.0" }
cognee-database = { path = "../database", version = "0.2.0" }
cognee-session = { path = "../session", version = "0.2.0" }
cognee-truth-subspace = { path = "../truth-subspace", version = "0.2.0" }
cognee-delete = { path = "../delete", version = "0.2.0" }

chrono.workspace = true
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
async-trait.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
futures.workspace = true
tracing.workspace = true
url.workspace = true

# Integration tests whose whole file is behind a `#![cfg(feature = ...)]`.
# Without a `required-features` entry cargo still builds the target in a lane
# that does not enable the feature, and it compiles to a green `running 0
# tests` that is indistinguishable from a lane that really ran them. Declaring
# the requirement makes cargo omit the target instead, and naming it explicitly
# then fails with the feature to pass rather than reporting a green zero.
# Every other test target here is still auto-discovered; listing these does not
# opt out of that (`autotests` stays at its edition-2018+ default of `true`).

[[test]]
name = "e2e_memify"
path = "tests/e2e_memify.rs"
required-features = ["testing"]

[[test]]
name = "integration_memify"
path = "tests/integration_memify.rs"
required-features = ["testing"]

[[test]]
name = "memify_distill_sessions"
path = "tests/memify_distill_sessions.rs"
required-features = ["testing"]

[[test]]
name = "memify_feedback"
path = "tests/memify_feedback.rs"
required-features = ["testing"]

[[test]]
name = "memify_persist_sessions"
path = "tests/memify_persist_sessions.rs"
required-features = ["testing"]

[[test]]
name = "memify_sync_graph_session"
path = "tests/memify_sync_graph_session.rs"
required-features = ["testing"]

[dev-dependencies]
cognee-storage    = { path = "../storage", features = ["testing"] }
cognee-embedding  = { path = "../embedding", features = ["onnx"] }
cognee-graph      = { path = "../graph", features = ["testing", "ladybug"] }
cognee-vector     = { path = "../vector", features = ["testing"] }
cognee-database   = { path = "../database", features = ["sqlite"] }
cognee-search     = { path = "../search" }
cognee-test-utils = { path = "../test-utils" }
# `mock` enables the cassette record/replay clients (ReplayLlm/RecordingLlm) the
# integration tests use to run offline against committed cassettes. Cargo unifies
# this dev-dep with the mock-less [dependencies] entry into one test build, so
# there is no double-trait-copy issue (that caveat is specific to cognee-llm's
# own test target — see crates/llm/src/mock/recording.rs).
cognee-llm        = { path = "../llm", features = ["mock"] }
cognee-session    = { path = "../session", features = ["fs"] }
dotenv.workspace = true
# `oversized_identifier_retry` drives a real `OpenAIAdapter` against a local mock
# endpoint, which is the only way to observe the corrective-retry ladder end to
# end: the loop lives in the adapter, so a hand-written `Llm` double would test
# the double. Same version as cognee-llm's own dev-dependency.
httpmock = "0.8"
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
