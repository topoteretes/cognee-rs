[package]
name = "cognee-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared utilities — deterministic IDs, hashing, and config helpers — for the cognee pipeline."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Structured logging/tracing
tracing.workspace = true

# Random (for jitter)
rand.workspace = true

# Cross-platform async timer for retry backoff (retry.rs). Works on both native
# and wasm32: its `wasm-bindgen` feature routes through setTimeout on wasm and is
# a no-op on native (which uses a timer thread). This is why retry needs no tokio
# and no in-code cfg — tokio's timer would never fire on wasm32-unknown.
futures-timer.workspace = true

# UUID generation. The `js` wasm randomness source is enabled on the workspace
# uuid dep (a no-op on native), so v4 works on wasm with no per-crate override.
uuid = { workspace = true, features = ["v4", "v5"] }

# Secret redaction (cognee_utils::redact)
regex = { workspace = true }

# JSON payload walking (cognee_utils::sanitize).
#
# This crate GETS `preserve_order`, and cannot opt out while using
# `workspace = true` — the root manifest enables it (see the long note there),
# and cargo features are additive and unify across the whole build graph. An
# earlier version of this comment claimed the opposite, "deliberately WITHOUT
# `preserve_order`", which was never true of the built artifact: `cargo package
# -p cognee-utils` emits `[dependencies.serde_json] features =
# ["preserve_order"]`.
#
# So `serde_json::Map` here is an insertion-ordered `IndexMap`, not a
# key-sorting `BTreeMap`, which is what makes JSON key order match Python's
# insertion-ordered dicts.
#
# This rides into the PUBLISHED manifest: `cognee-utils` has no
# `publish = false`, and `scripts/split/publish-order.sh` feeds
# `release-publish.yml`'s crates.io job from exactly the crates lacking that
# flag. External consumers therefore inherit an `IndexMap`-backed
# `serde_json::Map` in their own code. Accepted deliberately: consistency with
# the rest of the workspace and parity with Python beat a feature-free
# published manifest. (Considered and rejected: giving this crate its own
# `serde_json = "1"` line to keep the published manifest clean, and reverting
# the workspace-wide enable.)
#
# One behaviour depends on it directly: the sanitizer's key-collision
# tie-break, which fires only when a JSON object holds two keys differing by
# nothing but an embedded NUL. See `sanitize_json_in_place`, which documents
# the rule under both backings, and
# `colliding_keys_resolve_to_the_last_in_map_order`, which asserts the right
# winner either way.
serde_json = { workspace = true }

# WebAssembly (browser) spike — Config 1. The only getrandom in our wasm tree is
# 0.2, pulled transitively by rand 0.8 (the jitter in retry.rs). On wasm32 it has
# no default backend, so the `js` feature routes it through the browser crypto
# API. This is a feature-only shim: rand already pulls getrandom 0.2; declaring
# it here just lets Cargo's feature unification turn the JS backend on.
# (uuid does NOT use getrandom on wasm32-unknown, and tokio is no longer a library
# dependency at all — retry uses futures-timer — so no other wasm shim is needed.
# See docs/spike-wasm-config1.md.)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# tokio is only used by the #[tokio::test] async tests, which run on the native
# libtest harness (not wasm-bindgen-test). Gate the dev-dep — and the retry test
# module that needs it (see retry.rs) — off wasm so `cargo test --target wasm32`
# compiles, mirroring how crates/chunking/Cargo.toml splits its dev-deps.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
