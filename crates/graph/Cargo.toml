[package]
name = "cognee-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Knowledge-graph database abstraction (embedded Ladybug) for the cognee pipeline."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Core async and serialization
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# UUID and time
uuid.workspace = true
chrono.workspace = true

# Ladybug database (feature-gated)
lbug = { workspace = true, optional = true }

# PostgreSQL graph (feature-gated)
sea-orm = { version = "1.1", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
    "with-json",
    # `postgres-array` lets us bind `Vec<String>` as Postgres `text[]` params,
    # used by `has_edges` to batch-check edges in a single `unnest(...)` query.
    "postgres-array",
], optional = true }
sea-orm-migration = { version = "1.1", features = [
    "runtime-tokio-rustls",
], optional = true }

# Internal dependencies
cognee-models = { path = "../models", version = "0.2.0" }
cognee-utils = { path = "../utils", version = "0.2.0" }

[features]
ladybug = ["dep:lbug"]
postgres = ["dep:sea-orm", "dep:sea-orm-migration"]
testing = []

# Integration tests whose whole file is behind a `#![cfg(feature = ...)]`.
# Without a `required-features` entry cargo still builds the target in a lane
# that does not enable the feature, and it compiles to a green `running 0
# tests` that is indistinguishable from a lane that really ran them. Declaring
# the requirement makes cargo omit the target instead, and naming it explicitly
# then fails with the feature to pass rather than reporting a green zero.
# Every other test target here is still auto-discovered; listing these does not
# opt out of that (`autotests` stays at its edition-2018+ default of `true`).

[[test]]
name = "formatted_graph_data"
path = "tests/formatted_graph_data.rs"
required-features = ["testing"]

[[test]]
name = "ladybug_close"
path = "tests/ladybug_close.rs"
required-features = ["ladybug"]

[[test]]
name = "ladybug_integration"
path = "tests/ladybug_integration.rs"
required-features = ["ladybug"]

[[test]]
name = "ladybug_span_instrumentation"
path = "tests/ladybug_span_instrumentation.rs"
required-features = ["ladybug"]

[[test]]
name = "pg_graph_close"
path = "tests/pg_graph_close.rs"
required-features = ["postgres"]

[[test]]
name = "pg_graph_integration"
path = "tests/pg_graph_integration.rs"
required-features = ["postgres"]

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true
cognee-test-utils = { path = "../test-utils" }
# `create_temp_postgres_db` (used by the Postgres graph suites for their per-test
# databases) opens its maintenance connection through `cognee_database::connect`,
# which needs an sqlx driver at *runtime* — sea-orm returns "URL scheme not
# supported" without one. `cognee-database` declares no default features, and
# `cognee-test-utils` pulls it in bare, so the driver would otherwise arrive only
# by feature unification with this crate's own `postgres` feature. That happens to
# hold today (one shared sea-orm 1.1), but it is invisible and would break the
# moment the two crates resolve to different sea-orm versions, with a runtime
# error rather than a compile one. Spell it out instead.
cognee-database = { path = "../database", features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
